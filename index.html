/* ============================================================
   La lectura de una tarjeta en blanco: revisarla, decidir si se
   puede guardar y convertirla en hechos. Puro: ni DOM ni red.

   El valor de todo esto es cazar los errores de lectura sin que
   nadie compare número por número. Un índice repetido reparte mal
   los golpes de ventaja de todo el torneo en silencio, y el
   silencio es justo lo que queremos evitar.
   ============================================================ */
const HOYOS_TARJETA = 18
const PAR_MIN = 3
const PAR_MAX = 6
const PAR_TOTAL_MIN = 68
const PAR_TOTAL_MAX = 74

/* Entero o null. Nunca lanza: lo que no es un entero limpio es un hueco.
   Dos casos, no tres: un número ya entero (incluido 17.0, que en JS ES el
   entero 17 y nunca llega como flotante de verdad) y un texto que solo
   trae dígitos. Un tercer caso para "un flotante casi entero" nunca se
   alcanzaría -el primer caso ya acepta cualquier entero- así que no se
   escribe. */
function enteroOhueco (v) {
  if (typeof v === 'number' && Number.isFinite(v) && Number.isInteger(v)) return v
  if (typeof v === 'string' && /^-?\d+$/.test(v.trim())) return parseInt(v, 10)
  return null
}

const aDieciocho = (a) => Array.from({ length: HOYOS_TARJETA }, (_, h) => enteroOhueco(Array.isArray(a) ? a[h] : undefined))

/* Revisa una respuesta cruda de la IA. Devuelve SIEMPRE la misma forma,
   venga lo que venga: 18 pares, 18 índices, 18 marcas y una lista de
   avisos ya escritos en español. */
function revisaLectura (cruda) {
  const c = cruda && typeof cruda === 'object' ? cruda : {}
  const nombre = typeof c.campo === 'string' ? c.campo.trim() : ''
  const par = aDieciocho(c.par)
  const si = aDieciocho(c.si)
  const marcas = Array.from({ length: HOYOS_TARJETA }, () => ({ par: null, si: null }))
  const avisos = []

  for (let h = 0; h < HOYOS_TARJETA; h++) {
    if (par[h] === null) marcas[h].par = 'hueco'
    else if (par[h] < PAR_MIN || par[h] > PAR_MAX) marcas[h].par = 'fuera'
  }

  /* El índice se marca 'repetido' en la segunda aparición y siguientes: la
     primera puede ser la buena y señalarla confundiría. */
  const vistos = new Set()
  for (let h = 0; h < HOYOS_TARJETA; h++) {
    const v = si[h]
    if (v === null) { marcas[h].si = 'hueco'; continue }
    if (v < 1 || v > HOYOS_TARJETA) { marcas[h].si = 'fuera'; continue }
    if (vistos.has(v)) { marcas[h].si = 'repetido'; continue }
    vistos.add(v)
  }
  const faltan = []
  for (let n = 1; n <= HOYOS_TARJETA; n++) if (!vistos.has(n)) faltan.push(n)
  if (faltan.length) {
    avisos.push(faltan.length === 1
      ? `falta el índice ${faltan[0]}`
      : `faltan los índices ${faltan.join(', ')}`)
  }

  const total = par.reduce((t, x) => t + (x ?? 0), 0)
  if (!par.includes(null) && (total < PAR_TOTAL_MIN || total > PAR_TOTAL_MAX)) {
    avisos.push(`el par suma ${total}, revísalo`)
  }

  return { campo: nombre, par, si, marcas, avisos }
}

/* Se puede guardar cuando ningún hoyo está señalado. El aviso del par
   total NO entra: hay campos cortos legítimos. */
const lecturaCompleta = (rev) =>
  rev.marcas.every(m => m.par === null && m.si === null)

/* Los hoyos señalados no se emiten: se quedan como estaban en vez de
   ensuciar el torneo con un número dudoso que además viaja a los demás. */
function aplicaCampo (T, d, rev) {
  if (rev.campo) emitir(T, `c.${d}.n`, rev.campo)
  for (let h = 0; h < HOYOS_TARJETA; h++) {
    if (rev.marcas[h].par === null) emitir(T, `c.${d}.par.${h}`, rev.par[h])
    if (rev.marcas[h].si === null) emitir(T, `c.${d}.si.${h}`, rev.si[h])
  }
}

/* Uno fotografía y todos juegan: el campo viaja como hecho, así que el
   resto del grupo recibe los 36 números sin tocar nada. */
function aplicaCampoATodos (T, rev) {
  for (let d = 0; d < dias(T); d++) aplicaCampo(T, d, rev)
}




/* La sección de Ajustes que convierte una foto en el campo del torneo.
   Nada se guarda hasta tocar Guardar: un par mal leído falsea el
   Stableford y las presiones de todo el torneo, y viaja a los demás. */
function bloqueClaveIa (S) {
  const hay = !!(S.ia && S.ia.clave)
  return `<h2>Clave de la IA</h2>
    <p class="guia">Para leer tarjetas con la cámara. Es tuya y de pago: vive solo en este teléfono y no se comparte con el grupo.</p>
    <input type="password" placeholder="${hay ? 'guardada en este teléfono' : 'sk-…'}" autocomplete="off" data-cambio="ponClaveIa">
    ${hay ? '<button class="btn sec" data-accion="borrarClaveIa">Borrar la clave</button>' : ''}`
}

function tablaLectura (rev) {
  const fila = (et, cual) => {
    const celdas = Array.from({ length: HOYOS_TARJETA }, (_, h) => {
      const motivo = rev.marcas[h][cual]
      return `<td class="${motivo ? 'dudoso' : ''}"><input value="${esc(rev[cual][h] ?? '')}" inputmode="numeric"
        data-cambio="editaLectura" data-campo="${cual}" data-hoyo="${h}"></td>`
    }).join('')
    return `<tr><td class="nom-col">${et}</td>${celdas}</tr>`
  }
  const cab = Array.from({ length: HOYOS_TARJETA }, (_, h) => `<th>${h + 1}</th>`).join('')
  return `<div class="rejilla"><table>
      <tr><th>Hoyo</th>${cab}</tr>
      ${fila('Par', 'par')}
      ${fila('SI', 'si')}
    </table></div>`
}
function bloqueFoto (T, S) {
  const clave = !!(S.ia && S.ia.clave)
  const cab = '<h2>Leer de una foto</h2>'
  if (!clave) {
    return `${cab}<p class="guia">Pon tu clave de la IA más abajo y aquí podrás fotografiar la tarjeta en blanco del campo para dar de alta los 36 números de un tirón.</p>`
  }
  if (S.leyendo) return `${cab}<p class="guia">Leyendo la tarjeta…</p>`

  const rev = S.lectura
  const n = dias(T)
  const listo = rev && lecturaCompleta(rev)
  return `${cab}
    <p class="guia">Fotografía la tarjeta EN BLANCO del campo. Nada se guarda hasta que lo revises y toques Guardar.</p>
    <div class="foto-zona">
      <label class="btn sec">Tomar o elegir la foto
        <input type="file" accept="image/*" capture="environment" data-cambio="tomarFoto" hidden></label>
      ${S.foto ? `<img class="foto-prev" src="${esc(S.foto)}" alt="la tarjeta">
        <button class="btn sec" data-accion="quitarFoto">Quitar la foto</button>` : ''}
    </div>
    ${S.errorIa ? `<p class="aviso-ia">${esc(S.errorIa)}</p>` : ''}
    ${rev
      ? `<h2>Lo que leyó</h2>
        <input value="${esc(rev.campo)}" placeholder="nombre del campo" data-cambio="editaLectura" data-campo="campo" data-hoyo="-1">
        ${tablaLectura(rev)}
        ${rev.avisos.length ? `<p class="guia">${rev.avisos.map(a => esc(a)).join(' · ')}</p>` : ''}
        <button class="btn" data-accion="guardaCampoDia"${listo ? '' : ' disabled'}>Guardar en este día</button>
        ${n > 1 ? `<button class="btn sec" data-accion="guardaCampoTodos"${listo ? '' : ' disabled'}>Guardar en las ${esc(n)} rondas</button>` : ''}
        ${listo ? '' : '<p class="guia">Corrige lo marcado para poder guardar.</p>'}`
      : ''}`
}


/* Cuántos golpes de ventaja caen en un hoyo, dado el hándicap de campo
   del jugador (ch) y el índice de dificultad del hoyo (siHoyo).
   Un ch negativo es un jugador "plus": devuelve golpes, y los devuelve
   empezando por los hoyos MÁS FÁCILES. */
function golpesEnHoyo (ch, siHoyo) {
  if (ch === 0) return 0
  if (ch < 0) {
    const p = -ch
    const result = -(Math.floor(p / 18) + (siHoyo > 18 - (p % 18) ? 1 : 0))
    return result || 0
  }
  return Math.floor(ch / 18) + (siHoyo <= (ch % 18) ? 1 : 0)
}
const puntos = (neto, parHoyo) => Math.max(0, 2 - (neto - parHoyo))

/* Un solo índice para todos los campos del torneo, redondeado. */
const hcpCampo = (T, jid) => Math.round(indice(T, jid) || 0)
function resumenRonda (T, d, jid) {
  const ch = hcpCampo(T, jid)
  let bruto = 0, neto = 0, pts = 0, jugados = 0
  for (let h = 0; h < HOYOS; h++) {
    const g = golpe(T, d, jid, h)
    if (g === null) continue
    jugados++
    const n = g - golpesEnHoyo(ch, si(T, d, h))
    bruto += g
    neto += n
    pts += puntos(n, par(T, d, h))
  }
  return { bruto, neto, pts, jugados, ch }
}
function resumenTotal (T, jid) {
  const total = { bruto: 0, neto: 0, pts: 0, jugados: 0 }
  const n = dias(T)
  for (let d = 0; d < n; d++) {
    const r = resumenRonda(T, d, jid)
    total.bruto += r.bruto
    total.neto += r.neto
    total.pts += r.pts
    total.jugados += r.jugados
  }
  return total
}

/* La notación de una tarjeta de golf de papel: círculo para lo que va bajo
   par, cuadro para lo que va encima, doble trazo para eagle y doble bogey.
   Es lo que hace que una tarjeta se lea de un vistazo sin sumar nada. */
function notaDe (g, parHoyo) {
  if (g === null || g === undefined) return ''
  const dif = g - parHoyo
  if (dif <= -2) return 'eagle'
  if (dif === -1) return 'birdie'
  if (dif === 1) return 'bogey'
  if (dif >= 2) return 'doble'
  return ''
}



/* ============================================================
   El motor que comparten los juegos de match play: el hoyo lo
   gana el lado con la mejor bola neta, y de ahí salen tramos,
   escaleras de presiones y líneas de dinero.
   ============================================================ */

/* Quién juega una apuesta: los del grupo que nombra, tal como esté HOY.
   Si alguien se cambia de grupo, la apuesta lo suelta -igual que en
   Teezr, donde el partido es del foursome, no de una lista aparte. */
function participantes (T, A) {
  return gruposDe(T, A.d)[A.grupo] || []
}

/* Ventaja dentro de la apuesta. 'diferencia' es lo de Teezr: nadie juega
   con su hándicap completo, todos contra el más bajo de la mesa. */
function ventajaJuego (T, A, jid) {
  const modo = cfgDe(T, A.id, 'hcp', 'diferencia')
  if (modo === 'bruto') return 0
  const ch = hcpCampo(T, jid)
  if (modo === 'completo') return ch
  const mesa = participantes(T, A).map(j => hcpCampo(T, j))
  return mesa.length ? ch - Math.min(...mesa) : 0
}
function netoJuego (T, A, jid, h) {
  const g = golpe(T, A.d, jid, h)
  if (g === null) return null
  const v = ventajaJuego(T, A, jid)
  return g - (v ? golpesEnHoyo(v, si(T, A.d, h)) : 0)
}

/* La mejor bola neta del lado. Quien levantó la bola no tiene golpe y
   simplemente no compite en ese hoyo; el hoyo solo deja de contar cuando
   NADIE del lado tiene golpe. */
function mejorBola (T, A, lado, h) {
  let mejor = null
  for (const jid of lado) {
    const n = netoJuego(T, A, jid, h)
    if (n !== null && (mejor === null || n < mejor)) mejor = n
  }
  return mejor
}
function resultadoHoyo (T, A, ladoA, ladoB, h) {
  const a = mejorBola(T, A, ladoA, h)
  const b = mejorBola(T, A, ladoB, h)
  if (a === null || b === null) return null
  return a < b ? 1 : (a > b ? -1 : 0)
}

/* Un tramo de match play. `cerradoEn` es el hoyo donde la ventaja se
   volvió mayor que los hoyos que quedaban: el famoso "3&2". */
function segmento (T, A, ladoA, ladoB, ini, fin, hasta = HOYOS - 1) {
  const hist = new Array(HOYOS).fill(null)
  let st = 0
  let jugados = 0
  let cerradoEn = null
  for (let h = ini; h <= Math.min(fin, hasta); h++) {
    const r = resultadoHoyo(T, A, ladoA, ladoB, h)
    if (r === null) continue
    st += r
    jugados++
    hist[h] = st
    if (cerradoEn === null && Math.abs(st) > fin - h) cerradoEn = h
  }
  return { et: '', ini, fin, st, hist, jugados, cerradoEn }
}
function marcadorTexto (seg) {
  const cerrado = seg.cerradoEn ?? null
  const jugados = seg.jugados ?? seg.hist.filter(x => x !== null).length
  /* La ventaja es la del hoyo que CERRÓ el tramo, no la final: el
     marcador sigue creciendo después y salían cosas como «9&4» o «18&8»,
     que no existen. Y un tramo decidido en su último hoyo no es «1&0»:
     se gana por uno, sin hoyos por jugar. */
  if (cerrado !== null && cerrado < seg.fin) {
    return `${Math.abs(seg.hist[cerrado])}&${seg.fin - cerrado}`
  }
  if (!jugados) return '—'
  if (seg.st === 0) return 'empatados'
  return `${Math.abs(seg.st)} ${seg.st > 0 ? 'arriba' : 'abajo'}`
}

/* La escalera de Santa Fe, generalizada a cualquier tramo: la apuesta de
   salida corre entero, y cada apuesta abierta engendra UNA nueva -desde
   el hoyo siguiente- al llegar a `al` arriba o abajo. Ninguna se cierra y
   ninguna nace en el último hoyo del tramo. */
function presses (T, A, ladoA, ladoB, ini, fin, al = 2, hasta = HOYOS - 1) {
  const umbral = Math.max(1, al)
  let vivas = [{ et: 'salida', ini, fin, st: 0, p: false, hist: new Array(HOYOS).fill(null), jugados: 0 }]
  const todas = [vivas[0]]
  let n = 0
  for (let h = ini; h <= Math.min(fin, hasta); h++) {
    const r = resultadoHoyo(T, A, ladoA, ladoB, h)
    if (r === null) continue
    for (const ap of vivas) {
      if (h >= ap.ini) { ap.st += r; ap.hist[h] = ap.st; ap.jugados++ }
    }
    const nuevas = []
    for (const ap of vivas) {
      if (!ap.p && Math.abs(ap.st) >= umbral && h >= ap.ini && h < fin) {
        ap.p = true
        n++
        nuevas.push({ et: 'presión ' + n, ini: h + 1, fin, st: 0, p: false, hist: new Array(HOYOS).fill(null), jugados: 0 })
      }
    }
    vivas = vivas.concat(nuevas)
    todas.push(...nuevas)
  }
  return todas
}

/* Quién le paga a quién. En 1v1 sale una línea; en 2v2 cada quien le paga
   a su contraparte -el de su misma posición en el otro lado-, así que el
   monto es POR CABEZA, como se jugó en Vail. Con lados desiguales (el
   Mudo del hito 2) los de más pagan todos al mismo. */
function lineasPorSigno (ladoA, ladoB, signo, monto, motivo) {
  const m = Math.round(monto)
  if (!signo || !(m > 0) || !ladoA.length || !ladoB.length) return []
  const ganan = signo > 0 ? ladoA : ladoB
  const pierden = signo > 0 ? ladoB : ladoA
  return pierden.map((jid, i) => ({ de: jid, a: ganan[Math.min(i, ganan.length - 1)], monto: m, motivo }))
}



/* Los dos bandos de una apuesta. Con dos jugadores no hace falta marcar
   nada: cada quien es su lado. Con cuatro, manda lo marcado; sin marcas,
   se parte el grupo a la mitad en su orden, que es como se sientan en el
   carrito. */
/* El bando que se VE y el que se toca son el mismo: la vista y la acción
   llaman aquí. Antes la vista derivaba el bando de la posición y la acción
   suponía 0, así que el primer toque sobre alguien del bando 2 no hacía
   nada y el segundo lo mandaba al 1, dejando 3 contra 1. */
function ladoVisible (T, A, jid) {
  const p = participantes(T, A)
  const i = p.indexOf(jid)
  const marcado = ladoDe(T, A.id, jid)
  if (marcado !== null) return marcado
  return i >= 0 && i < Math.ceil(p.length / 2) ? 0 : 1
}

/* Los bandos se guardan por TORNEO y se leen contra el grupo de HOY: si
   los grupos se reacomodan entre días, las marcas viejas y las posiciones
   nuevas dejan de cuadrar y salía, por ejemplo, 1 contra 3 -que además
   `lineasPorSigno` paga tres a uno en un sentido y uno a uno en el otro-.
   Cuando no cuadran se reparte a la mitad y la pantalla lo dice. */
const bandosCuadran = (T, A) => {
  const p = participantes(T, A)
  if (p.length <= 2) return true
  const enCero = p.filter(j => ladoVisible(T, A, j) === 0).length
  return enCero * 2 === p.length
}
function ladosDe (T, A) {
  const p = participantes(T, A)
  if (p.length <= 2) return [p.slice(0, 1), p.slice(1, 2)]
  const mitad = Math.ceil(p.length / 2)
  if (!bandosCuadran(T, A)) return [p.slice(0, mitad), p.slice(mitad)]
  return [p.filter(j => ladoVisible(T, A, j) === 0), p.filter(j => ladoVisible(T, A, j) === 1)]
}


const matchVacio = () => ({ lineas: [], vivo: { forma: 'segmentos', lados: [[], []], filas: [] } })

/* Una fila del detalle: el tramo más lo que vale. `dinero` va desde el
   lado A, que es como lo lee la pantalla. */
function filaDeTramo (seg, et, monto) {
  const dinero = Math.sign(seg.st) * Math.round(monto)
  return { et, ini: seg.ini, fin: seg.fin, st: seg.st, hist: seg.hist, texto: marcadorTexto(seg), monto: Math.round(monto), dinero }
}
function evaluarMatch (T, A, hasta = HOYOS - 1) {
  const [la, lb] = ladosDe(T, A)
  if (!la.length || !lb.length) return matchVacio()
  const monto = cfgDe(T, A.id, 'monto', 100)
  const hoyos = cfgDe(T, A.id, 'hoyos', 18) === 9 ? 9 : HOYOS
  const seg = segmento(T, A, la, lb, 0, hoyos - 1, hasta)
  return {
    lineas: lineasPorSigno(la, lb, Math.sign(seg.st), monto, 'Hoyo por hoyo'),
    vivo: { forma: 'segmentos', lados: [la, lb], filas: [filaDeTramo(seg, 'Match', monto)] }
  }
}




/* Las tres apuestas del Nassau. El global NO es la suma de la ida y la
   vuelta: es su propio marcador continuo sobre los 18 hoyos. */
const TRAMOS_NASSAU = [[0, 8, 'Ida'], [9, HOYOS - 1, 'Vuelta'], [0, HOYOS - 1, 'Global']]
function evaluarNassau (T, A, hasta = HOYOS - 1) {
  const [la, lb] = ladosDe(T, A)
  if (!la.length || !lb.length) return { lineas: [], vivo: { forma: 'segmentos', lados: [[], []], filas: [] } }
  const monto = cfgDe(T, A.id, 'monto', 100)
  const al = cfgDe(T, A.id, 'al', 2)
  const conPress = cfgDe(T, A.id, 'press', 0) !== 0
  const filas = []
  const lineas = []
  for (const [ini, fin, et] of TRAMOS_NASSAU) {
    const tramos = conPress
      ? presses(T, A, la, lb, ini, fin, al, hasta).map((ap, i) => [ap, i === 0 ? et : `${et} · ${ap.et}`])
      : [[segmento(T, A, la, lb, ini, fin, hasta), et]]
    for (const [seg, nombreFila] of tramos) {
      filas.push(filaDeTramo(seg, nombreFila, monto))
      lineas.push(...lineasPorSigno(la, lb, Math.sign(seg.st), monto, nombreFila))
    }
  }
  return { lineas, vivo: { forma: 'segmentos', lados: [la, lb], filas } }
}




/* Tres partidos de seis hoyos, cambiando de rival -o de compañero- en cada
   tramo. La rotación es la de la guía: 1-2/3-4, 1-3/2-4, 1-4/2-3. */
const ROTACION_SIXES = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]]
const TRAMOS_SIXES = [[0, 5], [6, 11], [12, HOYOS - 1]]

/* Quién ganó el último hoyo que se decidió en el tramo: el desempate
   'ultimo'. 0 si el tramo no tuvo ninguno. */
function ultimoDecidido (seg) {
  let previo = 0
  let ultimo = 0
  for (let h = seg.ini; h <= seg.fin; h++) {
    if (seg.hist[h] === null) continue
    const paso = seg.hist[h] - previo
    if (paso !== 0) ultimo = Math.sign(paso)
    previo = seg.hist[h]
  }
  return ultimo
}
function evaluarSixes (T, A, hasta = HOYOS - 1) {
  const p = participantes(T, A)
  const vacia = { lineas: [], vivo: { forma: 'segmentos', lados: [[], []], filas: [] } }
  if (p.length !== 4) return vacia
  const monto = cfgDe(T, A.id, 'monto', 100)
  const modo = cfgDe(T, A.id, 'modo', 'ind') === 'parejas' ? 'parejas' : 'ind'
  const empate = cfgDe(T, A.id, 'empate', 'anula')
  const nom = (j) => corto(T, j)
  const filas = []
  const lineas = []
  /* El acumulado del empate corre por partido: en individual son dos
     partidos paralelos, cada uno con su bolsa. */
  const bolsa = [0, 0]
  for (let t = 0; t < TRAMOS_SIXES.length; t++) {
    const [ini, fin] = TRAMOS_SIXES[t]
    const [uno, dos] = ROTACION_SIXES[t]
    const duelos = modo === 'parejas'
      ? [[[p[uno[0]], p[uno[1]]], [p[dos[0]], p[dos[1]]],
          `Tramo ${t + 1} · ${nom(p[uno[0]])} y ${nom(p[uno[1]])} contra ${nom(p[dos[0]])} y ${nom(p[dos[1]])}`]]
      : [[[p[uno[0]]], [p[uno[1]]], `Tramo ${t + 1} · ${nom(p[uno[0]])}-${nom(p[uno[1]])}`],
         [[p[dos[0]]], [p[dos[1]]], `Tramo ${t + 1} · ${nom(p[dos[0]])}-${nom(p[dos[1]])}`]]
    duelos.forEach(([la, lb, et], i) => {
      const seg = segmento(T, A, la, lb, ini, fin, hasta)
      const valor = monto + bolsa[i]
      let signo = Math.sign(seg.st)
      if (signo === 0) {
        if (empate === 'acumula' && t < TRAMOS_SIXES.length - 1) { bolsa[i] = valor; filas.push(filaDeTramo(seg, et, 0)); return }
        if (empate === 'ultimo') signo = ultimoDecidido(seg)
      }
      bolsa[i] = 0
      /* La fila dice la verdad del tramo -'empatados' si lo estuvo- y el
         desempate por último hoyo se ve solo en el dinero. */
      const fila = filaDeTramo(seg, et, signo ? valor : 0)
      fila.dinero = signo * fila.monto
      filas.push(fila)
      lineas.push(...lineasPorSigno(la, lb, signo, valor, et))
    })
  }
  return { lineas, vivo: { forma: 'segmentos', lados: [p.slice(0, 2), p.slice(2)], filas } }
}



/* Nueve puntos por hoyo entre tres: 5 al mejor neto, 3 al segundo, 1 al
   tercero. Los empates reparten en partes iguales la suma de los lugares
   que empatan: 4-4-1 arriba, 5-2-2 abajo, 3-3-3 los tres. */
const VALORES_NINES = [5, 3, 1]
function repartoNines (netos) {
  const pts = [0, 0, 0]
  if (netos.length !== 3 || netos.some(n => n === null || n === undefined)) return pts
  const orden = [0, 1, 2].sort((a, b) => netos[a] - netos[b])
  let i = 0
  while (i < 3) {
    let j = i
    while (j + 1 < 3 && netos[orden[j + 1]] === netos[orden[i]]) j++
    const total = VALORES_NINES.slice(i, j + 1).reduce((a, b) => a + b, 0)
    const cada = total / (j - i + 1)
    for (let k = i; k <= j; k++) pts[orden[k]] = cada
    i = j + 1
  }
  return pts
}
function evaluarNines (T, A, hasta = HOYOS - 1) {
  const p = participantes(T, A)
  if (p.length !== 3) return { lineas: [], vivo: { forma: 'puntos', jugadores: [], porHoyo: [], totales: [] } }
  const punto = cfgDe(T, A.id, 'punto', 10)
  /* Contra la media es lo mismo que cobrarle a cada rival un tercio de la
     diferencia: la suma por jugador da idéntica, y así todo el dinero
     sigue siendo una línea de alguien a alguien. */
  const divisor = cfgDe(T, A.id, 'liq', 'rivales') === 'media' ? 3 : 1
  const porHoyo = []
  const totales = [0, 0, 0]
  for (let h = 0; h < HOYOS; h++) {
    if (h > hasta) { porHoyo.push(null); continue }
    const pts = repartoNines(p.map(j => netoJuego(T, A, j, h)))
    const hubo = pts.some(x => x > 0)
    porHoyo.push(hubo ? pts : null)
    if (hubo) for (let i = 0; i < 3; i++) totales[i] += pts[i]
  }
  const lineas = []
  for (let i = 0; i < 3; i++) {
    for (let j = i + 1; j < 3; j++) {
      const dif = Math.round((totales[i] - totales[j]) * punto / divisor)
      if (dif > 0) lineas.push({ de: p[j], a: p[i], monto: dif, motivo: 'Nines' })
      else if (dif < 0) lineas.push({ de: p[i], a: p[j], monto: -dif, motivo: 'Nines' })
    }
  }
  return { lineas, vivo: { forma: 'puntos', jugadores: p, porHoyo, totales } }
}



/* Se juegan los 18, pero solo cuentan once: los que cada quien marca
   durante la ronda. Un hoyo se decide hasta que entra el score del hoyo
   siguiente -de ese mismo jugador-, y ahí se congela. El 18 no tiene
   siguiente: se queda abierto hasta el final. */
const ONCE = 11
const bloqueadoOnces = (T, A, jid, h) =>
  h < HOYOS - 1 && golpe(T, A.d, jid, h + 1) !== null

/* La red de seguridad de la guía: si los hoyos que aún se pueden marcar
   son justo los que faltan para llegar a once, cuentan a la fuerza. */
function hoyosDeOnces (T, A, jid) {
  const marcados = []
  const abiertos = []
  for (let h = 0; h < HOYOS; h++) {
    if (marcaOnces(T, A.id, h, jid)) marcados.push(h)
    else if (!bloqueadoOnces(T, A, jid, h)) abiertos.push(h)
  }
  const faltan = ONCE - marcados.length
  const forzados = faltan > 0 && abiertos.length > 0 && abiertos.length <= faltan ? abiertos : []
  const cuentan = marcados.concat(forzados).sort((a, b) => a - b)
  return { marcados, abiertos, forzados, cuentan }
}
function evaluarOnces (T, A, hasta = HOYOS - 1) {
  const p = participantes(T, A)
  const monto = cfgDe(T, A.id, 'monto', 100)
  const jugadores = p.map(jid => {
    const q = hoyosDeOnces(T, A, jid)
    let total = 0
    let completo = q.cuentan.length === ONCE
    for (const h of q.cuentan) {
      const n = h <= hasta ? netoJuego(T, A, jid, h) : null
      if (n === null) { completo = false; continue }
      total += n
    }
    return { jid, marcados: q.marcados, forzados: q.forzados, cuentan: q.cuentan, total, compite: completo }
  })
  const lineas = []
  const compiten = jugadores.filter(x => x.compite)
  for (let i = 0; i < compiten.length; i++) {
    for (let j = i + 1; j < compiten.length; j++) {
      const a = compiten[i], b = compiten[j]
      if (a.total < b.total) lineas.push({ de: b.jid, a: a.jid, monto: Math.round(monto), motivo: 'Onces' })
      else if (b.total < a.total) lineas.push({ de: a.jid, a: b.jid, monto: Math.round(monto), motivo: 'Onces' })
    }
  }
  return { lineas, vivo: { forma: 'onces', jugadores } }
}



/* Medal: stroke play de toda la vida. Se suman los golpes netos y el más
   bajo gana. Lo que cambia respecto a la Tabla —que ya lleva el neto de
   todos— es que aquí hay dinero, y en esta app el dinero es siempre entre
   dos: cada pareja de la mesa liquida su monto, así que en un grupo de
   cuatro el que gana cobra tres veces y el último paga tres.

   Se comparan SOLO los hoyos que los dos jugaron. A media ronda, sumar
   totales enteros diría que va ganando el que menos hoyos lleva. */
function evaluarMedal (T, A, hasta = HOYOS - 1) {
  const p = participantes(T, A)
  const monto = Math.max(0, Math.round(Number(cfgDe(T, A.id, 'monto', 100)) || 0))
  const tope = Math.min(hasta, HOYOS - 1)
  const netos = p.map(jid => Array.from({ length: HOYOS }, (_, h) => (h <= tope ? netoJuego(T, A, jid, h) : null)))

  const lineas = []
  for (let i = 0; i < p.length; i++) {
    for (let j = i + 1; j < p.length; j++) {
      let ta = 0, tb = 0, comunes = 0
      for (let h = 0; h < HOYOS; h++) {
        if (netos[i][h] === null || netos[j][h] === null) continue
        ta += netos[i][h]; tb += netos[j][h]; comunes++
      }
      if (!comunes || ta === tb || !monto) continue
      const [gana, pierde] = ta < tb ? [p[i], p[j]] : [p[j], p[i]]
      lineas.push({ de: pierde, a: gana, monto, motivo: 'Medal' })
    }
  }

  const porHoyo = Array.from({ length: HOYOS }, (_, h) =>
    (netos.some(n => n[h] !== null) ? netos.map(n => n[h]) : null))
  const totales = netos.map(n => n.reduce((s, x) => s + (x ?? 0), 0))
  return { lineas, vivo: { forma: 'puntos', titulo: 'Neto', jugadores: p, porHoyo, totales } }
}



/* Skins: cada hoyo vale un skin. Lo gana quien haga la bola neta más baja
   ÉL SOLO; si empatan los dos mejores, no lo gana nadie y el skin se
   acumula al hoyo siguiente. Quien lo gana le cobra su valor a cada uno de
   los demás, que es lo que hace que un skin de dos hoyos acumulados en un
   grupo de cuatro duela de verdad.

   Los skins que queden acumulados al acabar la ronda se pierden: es la
   regla de la casa en todas partes, y es lo que hace que el 18 con tres
   acumulados sea el mejor hoyo del día. */
function evaluarSkins (T, A, hasta = HOYOS - 1) {
  const p = participantes(T, A)
  const monto = Math.max(0, Math.round(Number(cfgDe(T, A.id, 'monto', 50)) || 0))
  const acumula = Number(cfgDe(T, A.id, 'carry', 1)) !== 0
  const tope = Math.min(hasta, HOYOS - 1)

  const lineas = []
  const porHoyo = new Array(HOYOS).fill(null)
  const totales = p.map(() => 0)
  let bote = 1

  for (let h = 0; h <= tope; h++) {
    const netos = p.map(jid => netoJuego(T, A, jid, h))
    if (netos.every(n => n === null)) continue
    const mejor = Math.min(...netos.filter(n => n !== null))
    const cuantos = netos.filter(n => n === mejor).length
    const fila = p.map(() => 0)
    if (cuantos === 1) {
      const g = netos.indexOf(mejor)
      const valor = monto * bote
      for (let k = 0; k < p.length; k++) {
        if (k === g) continue
        fila[k] = -valor
        totales[k] -= valor
        if (valor) lineas.push({ de: p[k], a: p[g], monto: valor, motivo: `Skin del ${h + 1}` })
      }
      fila[g] = valor * (p.length - 1)
      totales[g] += fila[g]
      bote = 1
    } else {
      /* Nadie lo gana: se acumula. Sin acumulado, el skin simplemente se
         pierde y el siguiente vuelve a valer uno. */
      bote = acumula ? bote + 1 : 1
    }
    porHoyo[h] = fila
  }
  return { lineas, vivo: { forma: 'puntos', titulo: 'Skins', jugadores: p, porHoyo, totales } }
}




/* Chicago: cada quien empieza debiendo una cuota que sale de su hándicap
   —39 menos los golpes que recibe— y la va pagando con puntos: bogey 1,
   par 2, birdie 4, eagle 8; doble bogey o peor, nada. Gana quien más pase
   su cuota.

   Aquí el hándicap NO reparte golpes hoyo por hoyo: entra por la cuota, y
   los puntos se cuentan del score bruto contra el par. Es lo que hace que
   Chicago se sienta distinto de un Stableford neto aunque se parezcan en
   la tabla: al que juega mejor se le pide más, no se le quita menos. */
const CUOTA_BASE = 39
const puntosChicago = (golpes, parHoyo) => {
  if (golpes === null || golpes === undefined) return null
  const dif = golpes - parHoyo
  if (dif <= -2) return 8
  if (dif === -1) return 4
  if (dif === 0) return 2
  if (dif === 1) return 1
  return 0
}
const cuotaDe = (T, jid, base) => Math.max(0, Math.round(base - hcpCampo(T, jid)))
function evaluarChicago (T, A, hasta = HOYOS - 1) {
  const p = participantes(T, A)
  const monto = Math.max(0, Math.round(Number(cfgDe(T, A.id, 'monto', 20)) || 0))
  const base = Math.round(Number(cfgDe(T, A.id, 'cuota', CUOTA_BASE)) || CUOTA_BASE)
  const tope = Math.min(hasta, HOYOS - 1)

  const pts = p.map(jid => Array.from({ length: HOYOS }, (_, h) =>
    (h <= tope ? puntosChicago(golpe(T, A.d, jid, h), par(T, A.d, h)) : null)))
  const cuotas = p.map(jid => cuotaDe(T, jid, base))
  const sobre = p.map((_, i) => pts[i].reduce((s, x) => s + (x ?? 0), 0) - cuotas[i])

  const lineas = []
  for (let i = 0; i < p.length; i++) {
    for (let j = i + 1; j < p.length; j++) {
      const dif = sobre[i] - sobre[j]
      if (!dif || !monto) continue
      const cuanto = Math.abs(dif) * monto
      if (dif > 0) lineas.push({ de: p[j], a: p[i], monto: cuanto, motivo: 'Chicago' })
      else lineas.push({ de: p[i], a: p[j], monto: cuanto, motivo: 'Chicago' })
    }
  }

  const porHoyo = Array.from({ length: HOYOS }, (_, h) =>
    (pts.some(x => x[h] !== null) ? pts.map(x => x[h]) : null))
  return {
    lineas,
    vivo: {
      forma: 'puntos',
      titulo: 'Puntos sobre la cuota',
      /* Con nombre: cuatro cuotas sueltas no dicen de quién es cada una. */
      pie: cuotas.map(c => `cuota ${c}`),
      jugadores: p,
      porHoyo,
      totales: sobre
    }
  }
}



/* Unidades —«la basura» en la app de Santa Fe—: lo que se cobra aparte del
   match, por lo que pasa en cada hoyo. Se paga la DIFERENCIA de unidades
   contra cada rival del grupo, que es como se ha pagado siempre.

   Lo que vale una unidad, copiado de `unidadesRonda` de maestro-santafe:

     · birdie          1     sale solo del score
     · eagle o mejor   2     sale solo del score
     · sandy           1     se marca a mano, y solo cuenta con par o mejor
     · oyes            1     se marca a mano; es del más cercano en un par 3

   El sandy exige par o mejor porque salir de la trampa y hacer bogey no es
   un sandy. El oyes se cuenta donde esté marcado aunque el par diga otra
   cosa: la marca la puso alguien con la bola delante, y una ficha de campo
   equivocada no debe borrarle su unidad. La pantalla solo lo ofrece en los
   par 3, que es donde se juega. */
const VALOR_UNIDAD = 25
function unidadesDelHoyo (T, d, jid, h) {
  const g = golpe(T, d, jid, h)
  if (g === null) return null
  const p = par(T, d, h)
  const dif = g - p
  const b = dif === -1 ? 1 : (dif <= -2 ? 2 : 0)
  const s = marcaUni(T, d, 's', jid, h) && g <= p ? 1 : 0
  const o = marcaUni(T, d, 'o', jid, h) ? 1 : 0
  return { b, s, o, total: b + s + o }
}
function unidadesDeRonda (T, d, jid, hasta = HOYOS - 1) {
  const q = { b: 0, s: 0, o: 0, total: 0 }
  for (let h = 0; h <= Math.min(hasta, HOYOS - 1); h++) {
    const u = unidadesDelHoyo(T, d, jid, h)
    if (!u) continue
    q.b += u.b; q.s += u.s; q.o += u.o; q.total += u.total
  }
  return q
}
function evaluarUnidades (T, A, hasta = HOYOS - 1) {
  const p = participantes(T, A)
  const monto = Math.max(0, Math.round(Number(cfgDe(T, A.id, 'monto', VALOR_UNIDAD)) || 0))
  const tope = Math.min(hasta, HOYOS - 1)
  const cuentas = p.map(jid => unidadesDeRonda(T, A.d, jid, tope))

  const lineas = []
  for (let i = 0; i < p.length; i++) {
    for (let j = i + 1; j < p.length; j++) {
      const dif = cuentas[i].total - cuentas[j].total
      if (!dif || !monto) continue
      const cuanto = Math.abs(dif) * monto
      if (dif > 0) lineas.push({ de: p[j], a: p[i], monto: cuanto, motivo: 'Unidades' })
      else lineas.push({ de: p[i], a: p[j], monto: cuanto, motivo: 'Unidades' })
    }
  }

  const porHoyo = Array.from({ length: HOYOS }, (_, h) => {
    const fila = p.map(jid => (h <= tope ? (unidadesDelHoyo(T, A.d, jid, h) || { total: null }).total : null))
    return fila.some(x => x !== null && x !== 0) ? fila : null
  })
  return {
    lineas,
    vivo: {
      forma: 'puntos',
      titulo: 'Unidades',
      /* Solo de quien lleva algo: cuatro renglones de ceros no dicen nada
         y tapan el que sí importa. */
      pie: cuentas.map(q => (q.total
        ? [q.b ? `${q.b} de score` : '', q.s ? `${q.s} sandy` : '', q.o ? `${q.o} oyes` : ''].filter(Boolean).join(' y ')
        : null)),
      jugadores: p,
      porHoyo,
      totales: cuentas.map(q => q.total)
    }
  }
}




/* ============================================================
   PRESIONES · match play por nueves, presión automática al ir
   `t.pres.al` abajo (2 por omisión). Cada apuesta lleva su marcador
   y genera la suya al llegar ahí; ninguna se cierra: corren hasta el
   9 y hasta el 18. Reglas copiadas de presionesMatch() de la app de
   Santa Fe. Todo se calcula desde el punto de vista de `a`.
   ============================================================ */
const NUEVES = [[0, 8, 'Ida'], [9, 17, 'Vuelta']]
const signoPres = (v) => (v > 0 ? 1 : (v < 0 ? -1 : 0))
const acotaSliding = (v) => Math.max(-36, Math.min(36, parseInt(v, 10) || 0))

/* El rodado solo cuenta los días en que los dos iban en el MISMO grupo:
   comparar en frío dos tarjetas de grupos distintos inventa un match que
   nunca se jugó, y ese dinero fantasma movería los golpes del día
   siguiente. Es la primera línea del bucle de slidingRodado en Santa Fe
   (`const g=(S.grupos[p]||[]).find(...); if(!g) continue;`). */
const jugaronJuntos = (T, d, a, b) => gruposDe(T, d).some(g => g.includes(a) && g.includes(b))

/* El dinero sin bono del día `p` contra ese rival, o null cuando el rodado
   no se mueve: los dos `continue` de slidingRodado —no iban en el mismo
   grupo, o jugaron juntos pero nadie capturó—. `prev` es el sliding
   vigente ese día; se recibe ya calculado para no volver a pedirlo. */
function dineroRodado (T, p, a, b, prev) {
  if (!jugaronJuntos(T, p, a, b)) return null
  const q = dineroConSliding(T, p, a, b, prev)
  return q.capturado ? q.ida + q.vuelta : null
}

/* Un día de rodado: del sliding `prev` del día `p` al del día `p + 1`. */
const rodar = (T, p, a, b, prev) => {
  const din = dineroRodado(T, p, a, b, prev)
  return din === null ? prev : acotaSliding(prev + signoPres(din))
}

/* Sugerencia de Santa Fe: quien perdió el día anterior contra ese rival
   recibe un golpe más. Se mide sin el bono, como en la app original. */
function slidingSugerido (T, d, a, b) {
  if (d <= 0) return 0
  return rodar(T, d - 1, a, b, slidingDe(T, d - 1, a, b))
}

/* El sliding vigente del día `d`, arrastrado desde el día 0 hacia arriba.
   Escrito como recursión costaba el doble por cada día: pedía
   slidingDe(d−1) una vez para `prev` y otra vez dentro del dinero de ese
   mismo día, así que 18 días tardaban casi un segundo y el alta no pone
   tope al número de días. Iterando sale lo mismo en tiempo lineal. */
function slidingDe (T, d, a, b) {
  let v = 0
  for (let p = 0; p <= d; p++) {
    const pac = slidingPactado(T, p, a, b)
    if (pac !== null) v = acotaSliding(pac)
    else if (p > 0) v = rodar(T, p - 1, a, b, v)
  }
  return v
}
function motivoSliding (T, d, a, b) {
  if (slidingPactado(T, d, a, b) !== null) return 'pactado'
  if (d <= 0) return 'parejos'
  const din = dineroRodado(T, d - 1, a, b, slidingDe(T, d - 1, a, b))
  if (din === null || din === 0) return slidingDe(T, d, a, b) === 0 ? 'parejos' : 'como ayer'
  return din > 0 ? 'ayer ganaste' : 'ayer perdiste'
}
function ponSliding (T, d, a, b, v) {
  const val = acotaSliding(v)
  emitir(T, `v.${d}.${llavePareja(a, b)}`, [a, b].sort()[0] === a ? val : -val)
}
const ajustaSliding = (T, d, a, b, delta) => ponSliding(T, d, a, b, slidingDe(T, d, a, b) + delta)
function presionesMatch (T, d, a, b, hasta = 17) {
  return matchConSliding(T, d, a, b, hasta, slidingDe(T, d, a, b))
}

/* La escalera de presiones, sin saber CÓMO se decide cada hoyo. Eso lo
   dice `resultadoDe(h)`: +1 si lo gana el lado A, −1 si lo pierde, 0 si
   empatan, null si el hoyo todavía no cuenta. En las modalidades por
   parejas devuelve hasta ±2, porque ahí el hoyo se decide con las dos
   bolas —la mejor contra la mejor y la peor contra la peor— y cada
   comparación vale un punto.

   Las reglas de la escalera son las de Teezr: la primera presión no se
   abre en el tee del 1, se abre en el primer hoyo que alguien gana; la
   siguiente nace cuando la última abierta llega a `t.pres.al` arriba y
   arranca en el hoyo siguiente desde cero; todas las abiertas se mueven a
   la vez; y al cerrar, cada una con marcador distinto de cero paga su
   monto entero, no la diferencia. */
function escaleraPresiones (T, resultadoDe, hasta = 17) {
  const al = Math.max(1, presAl(T))
  const apuestas = []
  const porNueve = []
  for (const [ini, fin, nom] of NUEVES) {
    let aps = [{ et: nom + ' · salida', ini, fin, st: 0, p: false, hist: new Array(18).fill(null) }]
    apuestas.push(aps[0])
    let nPres = 0
    for (let h = ini; h <= Math.min(fin, hasta); h++) {
      const r = resultadoDe(h)
      if (r === null) continue
      for (const ap of aps) if (h >= ap.ini) { ap.st += r; ap.hist[h] = ap.st }
      const nuevas = []
      for (const ap of aps) {
        if (!ap.p && Math.abs(ap.st) >= al && h >= ap.ini && h < fin) {
          ap.p = true
          nPres++
          nuevas.push({ et: nom + ' · presión ' + nPres, ini: h + 1, fin, st: 0, p: false, hist: new Array(18).fill(null) })
        }
      }
      aps = aps.concat(nuevas)
      apuestas.push(...nuevas)
    }
    porNueve.push(aps.reduce((t, ap) => t + signoPres(ap.st), 0))
  }
  for (const ap of apuestas) ap.unidad = signoPres(ap.st)
  /* Carry (Teezr): la salida de la ida cerró en cero con sus nueve hoyos
     evaluados (hist sin huecos hasta el 9). Apagado por omisión. */
  const salidaIda = apuestas[0]
  const carry = presCarry(T) && salidaIda.hist.slice(0, 9).every(v => v !== null) && salidaIda.st === 0
  return { apuestas, porNueve, unidades: porNueve[0] + porNueve[1], carry }
}

/* El match uno contra uno con el sliding ya resuelto (`sv`: + = a le da
   golpes a b). Separado de presionesMatch para que el rodado, que viene
   arrastrando el sliding de ese día, no lo mande a recalcular. */
function matchConSliding (T, d, a, b, hasta, sv) {
  const neto = (jid, h) => {
    const g = golpe(T, d, jid, h)
    if (g === null) return null
    const recibe = jid === a ? (sv < 0 ? -sv : 0) : (sv > 0 ? sv : 0)
    return g - (recibe ? golpesEnHoyo(recibe, si(T, d, h)) : 0)
  }
  return escaleraPresiones(T, (h) => {
    const na = neto(a, h), nb = neto(b, h)
    if (na === null || nb === null) return null
    return na < nb ? 1 : (na > nb ? -1 : 0)
  }, hasta)
}

const diaCapturado = (m) => m.apuestas.some(x => x.hist.some(v => v !== null))

/* Bono de Santa Fe: para quien junte más apuestas ganadas en el día. */
function bonoMayoria (T, m) {
  let ga = 0, gb = 0
  for (const x of m.apuestas) { if (x.unidad > 0) ga++; else if (x.unidad < 0) gb++ }
  return ga > gb ? presBono(T) : (gb > ga ? -presBono(T) : 0)
}

/* Match de Teezr: el signo de salida de la ida + salida de la vuelta.
   Solo con los 18 hoyos evaluados y algún hoyo ganado en cada nueve. */
function matchSuma (T, m) {
  const sIda = m.apuestas.find(x => x.ini === 0), sVta = m.apuestas.find(x => x.ini === 9)
  const completo = sIda.hist.slice(0, 9).concat(sVta.hist.slice(9)).every(v => v !== null)
  const abiertas = sIda.hist.some(v => v) && sVta.hist.some(v => v)
  if (!completo || !abiertas) return 0
  return signoPres(sIda.st + sVta.st) * presBono(T)
}

/* Dinero del día desglosado. Con carry cada apuesta de la vuelta vale
   ida + vuelta + bono y el tercer monto ya no se paga aparte; sin carry,
   el tercero va por t.pres.match: 'mayoria' (Santa Fe) o 'suma' (Teezr). */
function dineroDesglosado (T, d, a, b) {
  return dineroConSliding(T, d, a, b, slidingDe(T, d, a, b))
}

function dineroConSliding (T, d, a, b, sv) {
  return dineroDeEscalera(T, matchConSliding(T, d, a, b, 17, sv))
}

/* Lo que vale una escalera ya corrida, venga de un uno contra uno o de un
   partido por parejas. Con carry cada apuesta de la vuelta vale ida +
   vuelta + bono y el tercer monto ya no se paga aparte; sin carry, el
   tercero va por t.pres.match: 'mayoria' (Santa Fe) o 'suma' (Teezr). */
function dineroDeEscalera (T, m) {
  const precioIda = presIda(T)
  const precioVuelta = m.carry ? presIda(T) + presVuelta(T) + presBono(T) : presVuelta(T)
  const ida = m.porNueve[0] * precioIda
  const vuelta = m.porNueve[1] * precioVuelta
  const tercero = m.carry ? 0 : (presMatch(T) === 'suma' ? matchSuma(T, m) : bonoMayoria(T, m))
  return { capturado: diaCapturado(m), carry: m.carry, precioIda, precioVuelta, ida, vuelta, tercero, total: ida + vuelta + tercero }
}

/* Dinero del día: null si nadie capturó. */
function dineroMatch (T, d, a, b) {
  const q = dineroDesglosado(T, d, a, b)
  return q.capturado ? q.total : null
}

/* Cuenta acumulada del torneo contra cada rival que te tocó en tu grupo.
   porRival es un Map: los ids vienen de los hechos y un objeto literal
   con llave "__proto__" sería una puerta abierta. */
function cuentaPresiones (T, jid) {
  const porRival = new Map()
  const porDia = []
  let gran = 0
  for (let d = 0; d < dias(T); d++) {
    const g = gruposDe(T, d).find(x => x.includes(jid))
    let dDia = null
    if (g) {
      for (const rid of g) {
        if (rid === jid) continue
        const din = dineroMatch(T, d, jid, rid)
        if (din === null) continue
        porRival.set(rid, (porRival.get(rid) || 0) + din)
        gran += din
        dDia = (dDia || 0) + din
      }
    }
    porDia.push(dDia)
  }
  return { porRival, porDia, gran }
}






/* ============================================================
   PRESIONES POR EQUIPOS · las tres modalidades de Teezr que no son
   uno contra uno. La escalera de presiones es la misma de siempre
   (src/presiones.js); lo único que cambia es CÓMO se decide cada
   hoyo, y eso es lo que arma este archivo.

   En las tres, el hoyo se decide con las DOS bolas del equipo: la
   mejor contra la mejor y la peor contra la peor. Cada comparación
   vale un punto, así que un hoyo va de −2 a +2 y las presiones se
   abren más rápido que en el uno contra uno.

     · parejas (4): dos equipos de dos, un solo partido.
     · mudo (3): se añade un jugador de mentira que hace par en todos
       los hoyos y nunca cobra ni paga. Cada real juega con él contra
       los otros dos: tres partidos, uno por turno.
     · yoyo (3): sin fantasma. El solitario usa su propio score dos
       veces —su mejor bola y su peor bola son la misma—, y si es él
       quien recibe ventaja, la recibe UNA sola vez: una de sus dos
       bolas va en neto y la otra en bruto.

   La ventaja sale del hándicap de cada quien contra el más bajo de la
   mesa, como en todo lo demás de la app; dentro de una pareja eso deja
   los golpes en el de hándicap más alto, que es lo que pide Teezr. El
   sliding pactado a mano es cosa del uno contra uno y aquí no entra.
   ============================================================ */
const MODOS_PRESIONES = [
  ['ind', 'Individuales', 2, 5],
  ['parejas', 'Parejas 2 contra 2', 4, 4],
  ['mudo', 'Mudo', 3, 3],
  ['yoyo', 'Yo-Yo', 3, 3]
]
const modoCabe = (modo, n) => {
  const m = MODOS_PRESIONES.find(x => x[0] === modo)
  return !!m && n >= m[2] && n <= m[3]
}
const ventajaEnLaMesa = (T, mesa, jid) => {
  const chs = mesa.map(j => hcpCampo(T, j))
  return chs.length ? hcpCampo(T, jid) - Math.min(...chs) : 0
}

/* Una bola es lo que esa bola hizo en el hoyo h, ya en neto. */
function bolaDeJugador (T, d, jid, ventaja) {
  return (h) => {
    const g = golpe(T, d, jid, h)
    if (g === null) return null
    return g - (ventaja ? golpesEnHoyo(ventaja, si(T, d, h)) : 0)
  }
}

/* El Mudo hace par en todos los hoyos. No recibe ni da golpes: su
   hándicap de campo es cero por definición, así que su bola es el par
   tal cual. */
const bolaDelMudo = (T, d) => (h) => par(T, d, h)

/* El hoyo con las dos bolas. Si a un lado le falta una —alguien levantó
   la bola—, la que quede cuenta como mejor y como peor: el compañero que
   se retiró no ayuda, pero tampoco hunde el hoyo dos veces. */
function resultadoDosBolas (bolasA, bolasB) {
  return (h) => {
    const a = bolasA.map(f => f(h)).filter(x => x !== null).sort((x, y) => x - y)
    const b = bolasB.map(f => f(h)).filter(x => x !== null).sort((x, y) => x - y)
    if (!a.length || !b.length) return null
    const cmp = (x, y) => (x < y ? 1 : (x > y ? -1 : 0))
    return cmp(a[0], b[0]) + cmp(a[a.length - 1], b[b.length - 1])
  }
}

/* Los partidos que se juegan ese día en ese grupo, según la modalidad.
   Cada uno lleva quiénes son de verdad en cada lado -los que pagan- y
   las bolas con las que se decide el hoyo. */
function partidosDePresiones (T, A, modo) {
  const p = participantes(T, A)
  if (!modoCabe(modo, p.length) || modo === 'ind') return []
  const d = A.d
  const bolaDe = (jid) => bolaDeJugador(T, d, jid, ventajaEnLaMesa(T, p, jid))

  if (modo === 'parejas') {
    const la = p.filter(j => ladoVisible(T, A, j) === 0)
    const lb = p.filter(j => ladoVisible(T, A, j) === 1)
    /* Bandos que no cuadran dos y dos no son un partido de parejas: se
       parte el grupo por la mitad, en el orden del carrito, y la pantalla
       lo dice. Es la misma regla que Hoyo por hoyo. */
    const [ca, cb] = la.length === 2 && lb.length === 2 ? [la, lb] : [p.slice(0, 2), p.slice(2, 4)]
    return [{
      et: 'Parejas',
      realesA: ca,
      realesB: cb,
      bolasA: ca.map(bolaDe),
      bolasB: cb.map(bolaDe),
      cuadran: la.length === 2 && lb.length === 2
    }]
  }

  return p.map((jid, i) => {
    const otros = p.filter((_, k) => k !== i)
    const ventaja = ventajaEnLaMesa(T, p, jid)
    const bolasA = modo === 'mudo'
      ? [bolaDe(jid), bolaDelMudo(T, d)]
      /* Yo-Yo: sus dos bolas son la suya. Si recibe ventaja, una va en
         neto y la otra en bruto —la ventaja se aplica una sola vez—. */
      : [bolaDeJugador(T, d, jid, ventaja), bolaDeJugador(T, d, jid, 0)]
    return {
      et: modo === 'mudo' ? 'Con el Mudo' : 'Yo-Yo',
      realesA: [jid],
      realesB: otros,
      bolasA,
      bolasB: otros.map(bolaDe),
      cuadran: true
    }
  })
}

/* Cada quien liquida con cada rival del otro bando: así el dinero de la
   mesa suma cero venga el partido de dos contra dos o de uno contra dos,
   y nadie cobra por tres lados mientras paga por uno. */
function lineasDePartido (realesA, realesB, total) {
  const monto = Math.abs(Math.round(total))
  if (!monto) return []
  const lineas = []
  for (const x of realesA) {
    for (const y of realesB) {
      if (total > 0) lineas.push({ de: y, a: x, monto, motivo: 'Presiones' })
      else lineas.push({ de: x, a: y, monto, motivo: 'Presiones' })
    }
  }
  return lineas
}
function evaluarPresionesEquipos (T, A, modo, hasta = HOYOS - 1) {
  const partidos = partidosDePresiones(T, A, modo)
  const lineas = []
  const detalle = []
  for (const pt of partidos) {
    const m = escaleraPresiones(T, resultadoDosBolas(pt.bolasA, pt.bolasB), hasta)
    const q = dineroDeEscalera(T, m)
    if (q.capturado) lineas.push(...lineasDePartido(pt.realesA, pt.realesB, q.total))
    detalle.push({ ...pt, m, q })
  }
  return { lineas, vivo: { forma: 'presiones-equipos', modo, partidos: detalle, al: Math.max(1, presAl(T)) } }
}





/* Presiones no se da de alta: mientras el torneo las juegue, el libro
   sintetiza una apuesta por grupo. Su id no es de sortear -no hay hechos
   `a.` detrás- y por eso lleva su propia forma. */
const idPresiones = (grupo) => `pres-${grupo}`
const apuestaPresiones = (d, grupo) => ({ id: idPresiones(grupo), tipo: 'presiones', d, grupo })

/* El motor de presiones es por pareja; aquí se recorre la mesa entera y
   cada duelo se convierte en una línea. */
function evaluarPresiones (T, A, hasta) {
  const p = participantes(T, A)
  /* Las dos cosas pueden correr a la vez: el uno contra uno con cada quien
     y, encima, el partido por equipos. Si la modalidad por equipos elegida
     no cabe en este grupo -parejas con tres, Mudo con cuatro- se juegan
     las individuales solas en vez de dejar al grupo sin presiones. */
  const modo = presModo(T)
  const conEquipos = modo !== 'ind' && modoCabe(modo, p.length)
  const equipos = conEquipos ? evaluarPresionesEquipos(T, A, modo, hasta) : null
  /* Sin partido por equipos SIEMPRE se juegan las individuales, aunque
     estén apagadas: si no, un torneo con «parejas» elegido y un grupo de
     tres se quedaría sin presiones y sin decir por qué. */
  if (!presInd(T) && equipos) return equipos
  const lineas = equipos ? [...equipos.lineas] : []
  const pares = []
  for (let i = 0; i < p.length; i++) {
    for (let j = i + 1; j < p.length; j++) {
      const g = dineroDesglosado(T, A.d, p[i], p[j])
      pares.push({ a: p[i], b: p[j], ...g })
      if (!g.capturado || !g.total) continue
      const monto = Math.abs(Math.round(g.total))
      if (g.total > 0) lineas.push({ de: p[j], a: p[i], monto, motivo: 'Presiones' })
      else lineas.push({ de: p[i], a: p[j], monto, motivo: 'Presiones' })
    }
  }
  return {
    lineas,
    vivo: equipos
      ? { forma: 'presiones', pares, equipos: equipos.vivo }
      : { forma: 'presiones', pares }
  }
}

/* Si un juego se le puede poner a un grupo de n. Los de dos bandos piden
   2 o 4 exactos: con tres, el reparto 2 contra 1 paga torcido -lo
   resuelven Mudo y Yo-Yo en el hito 2-. Una sola regla, usada por el
   libro para sintetizar la apuesta del torneo y por la guía de la
   pestaña, para que las dos digan lo mismo. */
function cabeEnGrupo (juego, n) {
  const j = JUEGOS[juego]
  if (!j || !j.alta || n < j.min || n > j.max) return false
  return j.lados ? (n === 2 || n === 4) : true
}

/* Lo que se le puede ofrecer a un grupo de n. Presiones no aparece: vive
   en los ajustes del torneo, no en el alta. */
const tiposParaGrupo = (n) =>
  Object.keys(JUEGOS).filter(k => JUEGOS[k].alta && n >= JUEGOS[k].min && n <= JUEGOS[k].max)




/* Fecha LOCAL, nunca UTC: a las 23:30 en México, UTC ya cambió de día y
   la app saltaría a la ronda equivocada. Es la misma cuenta que hacía
   cargar() en Santa Fe. */
function hoyISO (ahora = new Date()) {
  const m = String(ahora.getMonth() + 1).padStart(2, '0')
  const d = String(ahora.getDate()).padStart(2, '0')
  return `${ahora.getFullYear()}-${m}-${d}`
}
function setDia (T, d) {
  if (d < 0 || d >= dias(T)) return
  T.d = d
  T.hoyo = 0
}

/* Un hecho remoto fusionado puede bajar t.dias por debajo del día activo
   -hoy solo alcanzable así, pero alcanzable-: T.d se queda apuntando a un
   día que ya no existe y ni la cabecera ni Ajustes tienen uno que mostrar.
   Se acota al último día real. */
function acotarDia (T) {
  if ((T.d || 0) >= dias(T)) {
    T.d = dias(T) - 1
    T.hoyo = 0
  }
}

/* Devuelve true si encontró el día de hoy, false si no -sincronizar() lo usa
   para saber si ya "situó" al torneo (punto B). setDia solo se llama cuando
   el día de hoy es DISTINTO del activo: setDia siempre pone T.hoyo = 0, y
   llamarlo aunque T.d ya fuera ese día resetea el hoyo capturado en cada
   carga -el bug que este fix cierra: guardas el teléfono en el hoyo 7,
   recargas, y apareces en el 1. */
function saltarAHoy (T, iso = hoyISO()) {
  acotarDia(T)
  for (let d = 0; d < dias(T); d++) {
    if (fecha(T, d) !== iso) continue
    if ((T.d || 0) !== d) setDia(T, d)
    return true
  }
  return false
}

/* Los torneos de un solo campo son la norma: la ficha del día 1 sirve para
   el 2. Se emite hecho por hecho, para que viaje como cualquier captura.
   Copia par, SI y campo -NO la salida: una salida heredada del día 1 se
   pintaría en la cabecera y en el selector como si fuera la real del día
   2, y casi nunca lo es (los horarios de salida cambian día a día aunque
   el campo se repita). */
function copiarFicha (T, de, a) {
  for (let h = 0; h < HOYOS; h++) {
    emitir(T, `c.${a}.par.${h}`, par(T, de, h))
    emitir(T, `c.${a}.si.${h}`, si(T, de, h))
  }
  emitir(T, `c.${a}.n`, campo(T, de))
}

const etiquetaDia = (T, d) => [fecha(T, d), salida(T, d)].filter(Boolean).join(' · ')
function vistaDias (T) {
  const activo = T.d || 0
  return `<div class="dias">${Array.from({ length: dias(T) }, (_, d) =>
    `<button class="dia${d === activo ? ' on' : ''}" data-accion="setDia" data-dia="${d}">
      <b>Día ${d + 1}</b><span>${esc(etiquetaDia(T, d)) || 'sin fecha'}</span>
    </button>`).join('')}</div>`
}

/* La versión de este armado. `armar.js` sustituye el 'dev' por la fecha y
   el commit al coser el HTML; en el código fuente se queda como está.

   Existe porque un teléfono con la app en su pantalla de inicio guarda el
   HTML y no lo suelta: Paulino publicó cinco veces y siguió viendo la
   versión vieja. Con esto la app se entera sola y ofrece pasar a la nueva,
   en vez de que cada quien tenga que adivinar cómo forzar a su iOS. */
const VERSION = '2026-09-16·10bff2f'
const VERSION_DEL_ARMADO = '2026-09-16·10bff2f'

/* El nombre de la constante es el ancla que se busca en el HTML servido.
   Se escribe partido para que esta línea no se encuentre a sí misma. */
const MARCA_VERSION = 'VERSION' + '_DEL_ARMADO'
function leeVersion (html) {
  const m = new RegExp(MARCA_VERSION + "\\s*=\\s*'([^']+)'").exec(String(html ?? ''))
  return m ? m[1] : null
}

/* Pregunta por el propio HTML con algo que el caché no reconozca y compara
   versiones. Nunca lanza: sin señal simplemente no hay novedad. */
async function hayVersionNueva (actual, buscar, url = '') {
  try {
    const r = await buscar(`${url}?v=${Date.now()}`, { cache: 'no-store' })
    if (!r || !r.ok) return null
    const v = leeVersion(await r.text())
    return v && v !== actual ? v : null
  } catch (e) {
    return null
  }
}

const ponCampo = (T, d, v) => emitir(T, `c.${d}.n`, String(v))
const ponFecha = (T, d, v) => emitir(T, `c.${d}.iso`, String(v ?? '').trim())
const ponSalida = (T, d, v) => emitir(T, `c.${d}.salida`, String(v ?? '').trim())
const ponCerrado = (T, v) => emitir(T, 't.cerrado', v ? 1 : 0)

/* El nombre y las rondas se escribían al crear el torneo y no había dónde
   cambiarlos nunca más. Viajan como hechos: el grupo entero ve el cambio.

   Los dos IGNORAN la entrada ilegible en vez de normalizarla. Un nombre
   vacío borraría el del grupo, y un número ilegible colapsaría el torneo a
   una ronda escondiendo los días ya jugados. No emitir es lo correcto:
   quien teclea pasa por el vacío antes de llegar a lo que quiere. */
function ponNombre (T, v) {
  const n = String(v ?? '').trim()
  if (n) emitir(T, 't.n', n)
}
function ponDias (T, v) {

  if (!/^\d+$/.test(s)) return
  emitir(T, 't.dias', acotaDias(s))
  acotarDia(T)
}

const enteroO = (v, def) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : def }
const ponPresOn = (T, v) => emitir(T, 't.pres.on', v ? 1 : 0)
/* El tipo de juego del torneo. Presiones enciende su pestaña; cualquier
   otro la apaga -y si es uno del registro, enciende la suya-. La lista se
   arma desde el registro: un juego nuevo allá aparece aquí solo. */
/* Primero los juegos de apuesta, con Hoyo por hoyo a la cabeza porque es
   el que juegan siempre y con el que nace el torneo. Stableford y
   presiones van después: uno usa la Tabla y el otro su propia pestaña. */
const JUEGOS_DEL_TORNEO = [
  ...Object.entries(JUEGOS).filter(([, j]) => j.alta).map(([k, j]) => [k, j.nombre]),
  ['stableford', 'Stableford'], ['presiones', 'Presiones']]
/* Elegir el juego ENCIENDE las presiones si es el que se eligió, pero ya
   no las apaga al elegir otro: se juegan presiones y unidades a la vez, o
   presiones y hoyo por hoyo, y apagarlas por elegir otra cosa le quitaba
   al grupo media apuesta sin avisar. Para apagarlas está su casilla. */
function ponFormato (T, v) {

  emitir(T, 't.formato', f)
  if (f === 'presiones') emitir(T, 't.pres.on', 1)
}

const ponPresVuelta = (T, v) => emitir(T, 't.pres.vuelta', Math.max(0, enteroO(v, 5)))

const ponPresCarry = (T, v) => emitir(T, 't.pres.carry', v ? 1 : 0)
const ponPresMatch = (T, v) => emitir(T, 't.pres.match', v === 'suma' ? 'suma' : 'mayoria')
const ponPresInd = (T, v) => emitir(T, 't.pres.ind', v ? 1 : 0)
const ponPresModo = (T, v) => emitir(T, 't.pres.modo', MODOS_PRESIONES.some(([k]) => k === v) ? v : 'ind')

/* Lo que se le puede ajustar al juego elegido. Vive en el TORNEO, no en
   una apuesta -hay un solo juego por torneo-, y por eso se lee y se
   escribe con el aid sintético del primer grupo: cfgDe lo manda a
   `t.j.<k>`, que sí cabe en 16 caracteres. */
function camposDelJuego (T) {
  const juego = JUEGOS[formato(T)]
  if (!juego || !juego.cfg.length) return ''
  const aid = formato(T) + '-0'
  const campos = juego.cfg.map(c => {
    const valor = cfgDe(T, aid, c.k, c.def)
    const control = c.opciones
      ? `<select data-cambio="setCfgJuego" data-k="${esc(c.k)}">${c.opciones.map(o =>
          `<option value="${esc(o.v)}"${String(o.v) === String(valor) ? ' selected' : ''}>${esc(o.et)}</option>`).join('')}</select>`
      : `<input value="${esc(valor)}" inputmode="numeric" data-cambio="setCfgJuego" data-k="${esc(c.k)}">`
    return `<label class="cfg-juego"><span>${esc(c.et)}</span>${control}</label>`
  }).join('')
  return `<p class="guia">Así se juega ${esc(juego.nombre)} en todo el torneo. Su pestaña lleva la cuenta.</p>${campos}`
}

/* `base` entra como argumento y no se lee de `location` aquí dentro:
   en Node no existe, y la prueba que pinta esta vista reventaría. */
/* El bloque de presiones: su casilla, la modalidad y las cantidades. Lo
   usan Ajustes y la última pregunta del asistente, y tienen que ser el
   mismo para que lo que se elige al empezar sea lo que se ve después. */
function bloquePresiones (T) {
