/* Portado de Santa Fe. Cada castigo es un CONTADOR de dos bits, porque en
   un mismo hoyo se puede pegar más de una vez fuera o al agua: OB en los
   bits 5-6 y hazard en los 7-8 (0 a 3 cada uno), y el bit 9 recuerda si fue
   un castigo el que abrió el hoyo. Los bits 0-4 quedan libres.

   Los golpes del castigo se EMITEN en s., no se derivan: el teléfono que
   recibe el score ya lo trae sumado y no vuelve a sumar. Dos teléfonos
   marcando el mismo OB tampoco lo cuentan doble: gana un hecho por llave. */
const PENALES = [
  { id: 'ob', desp: 5, golpes: 2, et: '⛔ OB' },
  { id: 'hazard', desp: 7, golpes: 1, et: '💧 hazard' }
]
const TOPE_PENAL = 3
const MASCARA_PENAL = 480          // bits 5-8: los dos contadores
/* bit 9: si fue un castigo el que abrió el hoyo (ver ciclaPenal). Es
   PEGAJOSO a propósito -no hay dónde más guardarlo- y no se limpia con una
   corrección manual de golpe: castigo (abre el hoyo, ABRIO=1) → -1 con
   cambiaGolpe (corrige el golpe, pero no toca ABRIO ni el contador) → el
   mismo castigo otra vez hasta dar la vuelta (el contador vuelve a 0, y
   como ABRIO seguía encendido, ciclaPenal vacía el hoyo entero) borra
   también la corrección manual, no solo el castigo. Idéntico a la app de
   referencia; se deja así a propósito en este hito. */
const ABRIO = 512                   // bit 9
const cuentaPenal = (x, desp) => (x >> desp) & 3
function ciclaPenal (T, jid, penal) {
  const d = T.d || 0, h = T.hoyo || 0
  const x = extra(T, d, jid, h), g = golpe(T, d, jid, h)
  const n = cuentaPenal(x, penal.desp), n2 = (n + 1) % (TOPE_PENAL + 1)
  const dif = (n2 - n) * penal.golpes      // entran, o salen si dio la vuelta
  let nx = (x & ~(3 << penal.desp)) | (n2 << penal.desp)
  const ks = `s.${d}.${jid}.${h}`, kx = `x.${d}.${jid}.${h}`
  /* Un sello COMPARTIDO para el par s./x.: sin esto, cada emitir toma el
     suyo por separado (Math.max(Date.now(), ct[k]+1)), y dos teléfonos
     ciclando castigos distintos casi al mismo tiempo pueden fusionar el s.
     de uno con el x. del otro -golpes de OB con el chip de hazard
     encendido. Con el mismo sello, el par siempre gana o pierde junto. */
  const t = selloPara(T, ks, kx)
  if (g === null) {                         // hoyo vacío: el castigo lo abre
    nx |= ABRIO
    emitir(T, ks, Math.min(15, par(T, d, h) + dif), t)
  } else if (!(nx & MASCARA_PENAL) && (x & ABRIO)) {
    emitir(T, ks, null, t); nx &= ~ABRIO    // se fue el último y él lo abrió: vacío otra vez
  } else {
    emitir(T, ks, Math.max(1, Math.min(15, g + dif)), t)
  }
  emitir(T, kx, nx, t)
}




/* Las apuestas del día: las que alguien dio de alta, más las que se
   sintetizan por grupo -sin hechos propios-: la de presiones mientras el
   torneo las juegue, y la del juego del torneo (el que se elige en
   Ajustes) en los grupos donde cabe. Un grupo de uno no tiene con quién
   apostar.

   El `grupo` de una apuesta sintética es el ÍNDICE POSICIONAL dentro de
   gruposDe -arreglo denso de los grupos no vacíos-, que es justo lo que
   participantes() usa para resolverlo a jugadores; NO es el número crudo
   de `g.<d>.<jid>`. */
function apuestasDelDia (T, d) {
  const juego = formato(T)
  const presiones = presOn(T)
  const sinteticas = []
  gruposDe(T, d).forEach((g, i) => {
    if (presiones && g.length >= 2) sinteticas.push(apuestaPresiones(d, i))
    if (cabeEnGrupo(juego, g.length)) sinteticas.push({ id: `${juego}-${i}`, tipo: juego, d, grupo: i })
  })
  return sinteticas.concat(apuestas(T, d))
}

/* Toda línea mueve el mismo monto de alguien a alguien: el neto de la
   mesa suma cero por construcción, sin importar cómo redondee cada juego. */
function resumirLineas (lineas) {
  const porJugador = new Map()
  const pares = new Map()
  const mueve = (jid, v) => porJugador.set(jid, (porJugador.get(jid) || 0) + v)
  for (const l of lineas) {
    mueve(l.a, l.monto)
    mueve(l.de, -l.monto)
    const k = llavePareja(l.de, l.a)
    const signo = [l.de, l.a].sort()[0] === l.a ? 1 : -1
    pares.set(k, (pares.get(k) || 0) + signo * l.monto)
  }
  return { lineas, porJugador, pares }
}
function libroDia (T, d, hasta = HOYOS - 1) {
  const lineas = []
  for (const A of apuestasDelDia(T, d)) {
    const juego = JUEGOS[A.tipo]
    if (!juego) continue
    const r = juego.evaluar(T, A, hasta)
    if (r && r.lineas) lineas.push(...r.lineas)
  }
  return resumirLineas(lineas)
}
function libroTorneo (T) {
  const lineas = []
  for (let d = 0; d < dias(T); d++) lineas.push(...libroDia(T, d).lineas)
  return resumirLineas(lineas)
}

/* Lo que un jugador tiene con cada rival, con el signo desde su lado:
   positivo = le deben.

   `pares` está llaveado con llavePareja(), que recorta cada jid con
   jidCorto -son jugadores dentro de un hecho, con su límite de 16
   caracteres-, así que la llave ya no trae el jid completo. Aquí se
   compara por jidCorto y el jid completo del rival se recupera buscándolo
   entre las llaves de porJugador, que sí las guarda enteras. */
function saldosDe (libro, jid) {
  const corto = jidCorto(jid)
  const fuera = []
  for (const [k, v] of libro.pares) {
    const [uno, dos] = k.split('|')
    if (uno !== corto && dos !== corto) continue
    if (!v) continue
    const rivalCorto = uno === corto ? dos : uno
    const rival = [...libro.porJugador.keys()].find(j => jidCorto(j) === rivalCorto) ?? rivalCorto
    fuera.push({ rival, saldo: uno === corto ? v : -v })
  }
  return fuera
}










/* Un hoyo vacío arranca en el par: en el campo casi nadie teclea un
   número desde cero, tocan +/- a partir de lo esperado. */
function cambiaGolpe (T, jid, delta) {
  const h = T.hoyo || 0
  const actual = golpe(T, T.d || 0, jid, h)
  const base = actual === null ? par(T, T.d || 0, h) : actual
  emitir(T, `s.${T.d || 0}.${jid}.${h}`, Math.max(1, base + delta))
}

/* Se llama abrirEnPar y no ponPar porque el armado cose todos los módulos
   en un solo ámbito: dos declaraciones `ponPar` de nivel superior —ésta y la
   de ajustes.js— reventarían el HTML con un SyntaxError. Todo nombre de
   nivel superior tiene que ser único en el proyecto entero. */
function abrirEnPar (T, jid) {
  const h = T.hoyo || 0
  emitir(T, `s.${T.d || 0}.${jid}.${h}`, par(T, T.d || 0, h))
}

/* Convención de Santa Fe: el guion se toca para anotar el par, el número
   para borrar. Emitir null vacía la llave y conserva el sello.

   x. antes que s.: con el sello COMPARTIDO (selloPara) el orden ya no
   importa para la fusión -los dos hechos llevan el mismo sello t, así que
   ganan o pierden juntos en cualquier teléfono sin importar en qué orden
   lleguen-. El orden solo sigue importando aquí para que el último elemento
   de T.pend sea el hecho s. (el que viaja con v=null), que es lo que mira
   una prueba con pend.at(-1). */
function borraHoyo (T, jid) {
  const h = T.hoyo || 0
  const ks = `s.${T.d || 0}.${jid}.${h}`, kx = `x.${T.d || 0}.${jid}.${h}`
  const t = selloPara(T, ks, kx)
  emitir(T, kx, 0, t)
  emitir(T, ks, null, t)
}
function mueveHoyo (T, delta) {
  T.hoyo = Math.max(0, Math.min(HOYOS - 1, (T.hoyo || 0) + delta))
}

/* Mi grupo si sé quién soy y estoy en uno; si no, todos. `T.todos` lo
   conmuta desde el enlace de abajo. */
function visiblesEnHoy (T) {
  const todos = jugadores(T)
  const mio = !T.todos && T.yo ? miGrupo(T, T.d || 0) : null
  return mio ? todos.filter(j => mio.includes(j.id)) : todos
}

/* Devuelve los botones pelones: el renglón los envuelve junto a los de
   Onces en un solo `.chips`, para que unos y otros compartan el corte de
   línea en vez de apilarse en dos hileras. */
function chipsCastigo (T, d, jid, h) {
  const x = extra(T, d, jid, h)
  return PENALES.map(p => {
    const n = cuentaPenal(x, p.desp)
    return `<button class="chip-pen${n ? ' on' : ''}" data-accion="castigo" data-jid="${esc(jid)}" data-penal="${p.id}">${p.et} +${p.golpes}${n > 1 ? ` ×${n}` : ''}</button>`
  }).join('')
}

/* Onces: por omisión un hoyo NO cuenta; es el jugador quien lo sube al
   marcador, y solo hasta que entra el golpe del hoyo siguiente. El chip
   vive aquí porque es donde se anota, no en la pestaña del juego.

   Con once hoyos ya marcados, el chip de un hoyo nuevo se pinta cerrado:
   el motor deja FUERA de competencia a quien marca de más, y eso no debe
   poder pasar por un toque distraído. Desmarcar uno de los once sí se
   puede: ese chip sigue vivo. */
function chipsOnces (T, d, jid, h) {
  const juegos = apuestasDelDia(T, d).filter(A => A.tipo === 'onces' && participantes(T, A).includes(jid))
  if (!juegos.length) return ''
  return juegos.map(A => {
    const q = hoyosDeOnces(T, A, jid)
    const puesto = q.marcados.includes(h)
    const lleno = !puesto && q.marcados.length >= ONCE
    const cerrado = lleno || bloqueadoOnces(T, A, jid, h)
    const clase = `chip-pen chip-once${cerrado ? ' cerrado' : (puesto ? ' on' : '')}`
    const et = `🔢 cuenta ${q.marcados.length} de ${ONCE}`
    if (cerrado) return `<span class="${clase}">${esc(et)}</span>`
    return `<button class="${clase}" data-accion="marcaOnce" data-aid="${esc(A.id)}" data-jid="${esc(jid)}">${esc(et)}</button>`
  }).join('')
}

/* Las unidades que no salen del score: el sandy y el oyes. El chip vive
   aquí, en Hoy, porque es donde está el dedo cuando pasa —nadie se va a
   otra pestaña a apuntar que salvó el par desde la trampa—.

   El oyes solo se ofrece en los par 3, que es donde se juega; el sandy, en
   cualquier hoyo. Los dos aparecen solo si el grupo está jugando unidades:
   si no, serían dos botones que no hacen nada. */
function chipsUnidades (T, d, jid, h) {
  const juegos = apuestasDelDia(T, d).filter(A => A.tipo === 'unidades' && participantes(T, A).includes(jid))
  if (!juegos.length) return ''
  const sandy = marcaUni(T, d, 's', jid, h)
  const oyes = marcaUni(T, d, 'o', jid, h)
  const g = golpe(T, d, jid, h)
  /* Un sandy marcado que no llega a par se pinta apagado con su aviso: la
     marca sigue puesta -el jugador la puso- pero no cuenta, y así se ve
     por qué la unidad no aparece en la cuenta. */
  const sandyVale = sandy && g !== null && g <= par(T, d, h)
  const etSandy = sandy && !sandyVale ? '🏖 sandy · sin par' : '🏖 sandy'
  const chip = (accion, et, on) =>
    `<button class="chip-pen${on ? ' on' : ''}" data-accion="${accion}" data-jid="${esc(jid)}">${esc(et)}</button>`
  return chip('marcaSandy', etSandy, sandyVale) +
    (par(T, d, h) === 3 ? chip('marcaOyes', '🎯 oyes', oyes) : '')
}

/* El bloque de Santa Fe: por jugador, puntos de este hoyo y los que lleva
   en la ronda. El chip del hoyo cuenta la historia de un vistazo: rojo con
   cero, verde con tres o más. */
function bloqueStableford (T, d, h, visibles) {
  const filas = visibles.map(j => {
    const g = golpe(T, d, j.id, h)
    const ch = hcpCampo(T, j.id)
    const pH = g === null ? null : puntos(g - golpesEnHoyo(ch, si(T, d, h)), par(T, d, h))
    const clase = pH === null ? '' : (pH === 0 ? ' mal' : (pH >= 3 ? ' bien' : ''))
    return `<tr><td>${esc(j.c)}</td>
      <td>${pH === null ? '' : `<span class="pt-chip${clase}">${esc(String(pH))}</span>`}</td>
      <td><b>${esc(String(resumenRonda(T, d, j.id).pts))}</b></td></tr>`
  }).join('')
  return `<div class="rejilla bloque"><table>
    <tr><th colspan="3">STABLEFORD · HOYO ${h + 1} · RONDA</th></tr>${filas}</table></div>`
}

/* Las apuestas vivas del nueve en curso contra cada rival de mi grupo,
   hasta el hoyo activo: lo que en Santa Fe se miraba antes de pegarle. */
function bloquePresiones (T, d, h) {
  if (!presOn(T) || !T.yo) return ''
  const g = miGrupo(T, d)
  const rivales = g ? g.filter(id => id !== T.yo) : []
  if (!rivales.length) return ''
  const fin = h < 9 ? 8 : 17
  const filas = rivales.map(rid => {
    const m = presionesMatch(T, d, T.yo, rid, h)
    const vivas = m.apuestas.filter(a => a.fin === fin && a.ini <= h)
    const marc = vivas.length
      ? vivas.map(a => `<i class="pres-viva${a.st > 0 ? ' arr' : (a.st < 0 ? ' aba' : '')}">${esc(a.st > 0 ? '+' + a.st : String(a.st))}</i>`).join('')
      : '<i class="pres-viva">—</i>'
    return `<tr><td>${esc(corto(T, rid))}</td><td>${marc}</td></tr>`
  }).join('')
  return `<div class="rejilla bloque"><table>
    <tr><th colspan="2">PRESIONES · ${h < 9 ? 'LA IDA' : 'LA VUELTA'}</th></tr>${filas}</table></div>`
}
function vistaHoy (T) {
  const d = T.d || 0
  const h = T.hoyo || 0
  const visibles = visiblesEnHoy(T)
  /* El neto del hoyo se muestra junto al hándicap porque es el número con
     el que se juega el stableford, y en la app anterior era lo primero que
     se miraba después del golpe. */
  const filas = visibles.map(j => {
    const g = golpe(T, d, j.id, h)
    const ch = hcpCampo(T, j.id)
    const ventaja = golpesEnHoyo(ch, si(T, d, h))
    const r = resumenRonda(T, d, j.id)
    const neto = g === null ? null : g - ventaja
    return `<div class="jug">
      <div class="jug-fila">${ventaja > 0 ? `<i class="tri t${Math.min(ventaja, 3)}" title="${esc(String(ventaja))} golpe${ventaja > 1 ? 's' : ''} de ventaja"></i>` : ''}
        <div class="quien">
          <span class="nom">${esc(j.c)}</span>
          <div class="meta">HCP ${esc(String(ch))}${neto === null ? '' : ` · neto ${esc(String(neto))}`}</div>
        </div>
        <div class="pasos">
          <button data-accion="golpeMenos" data-jid="${esc(j.id)}" aria-label="un golpe menos">−</button>
          <button class="marca${g === null ? ' vacio' : ''}" data-accion="${g === null ? 'ponerPar' : 'borrarHoyo'}" data-jid="${esc(j.id)}"
            aria-label="${g === null ? 'anotar el par' : 'borrar el hoyo'}">${g === null ? '–' : `<span class="nota ${notaDe(g, par(T, d, h))}">${esc(String(g))}</span>`}</button>
          <button data-accion="golpeMas" data-jid="${esc(j.id)}" aria-label="un golpe más">+</button>
        </div>
        <span class="pts-lado">${esc(String(r.pts))}p</span>
      </div>
      <div class="chips">${chipsCastigo(T, d, j.id, h)}${chipsOnces(T, d, j.id, h)}${chipsUnidades(T, d, j.id, h)}</div>
    </div>`
  }).join('')

  return `<div class="paso">
      <button data-accion="hoyoMenos" aria-label="hoyo anterior">‹</button>
      <div class="centro">
        <span class="num">${h + 1}</span> <span class="de">/ ${HOYOS}</span>
        <div class="datos">Hoyo ${h + 1} · par ${esc(String(par(T, d, h)))} · SI ${esc(String(si(T, d, h)))}</div>
      </div>
      <button data-accion="hoyoMas" aria-label="hoyo siguiente">›</button>
    </div>
    ${filas || '<p class="guia">Agrega jugadores en la pestaña Grupos.</p>'}
    ${filas ? bloqueStableford(T, d, h, visibles) : ''}
    ${filas ? bloquePresiones(T, d, h) : ''}
    ${filas ? '<p class="guia">Toca el guion para anotar el par, ajusta con − y +, y toca el número para borrar el hoyo.</p>' : ''}
    ${T.yo && miGrupo(T, d) ? `<p class="guia"><button class="enlace" data-accion="verTodos">${T.todos ? 'Ver solo mi grupo' : 'Ver a todos'}</button></p>` : ''}`
}




const NUEVE = 9
const sumaTramo = (T, d, jid, de, a) => {
  let t = 0
  let n = 0
  for (let h = de; h < a; h++) { const g = golpe(T, d, jid, h); if (g !== null) { t += g; n++ } }
  return n ? t : ''
}
const parTramo = (T, d, de, a) => {
  let t = 0
  for (let h = de; h < a; h++) t += par(T, d, h)
  return t
}

/* Una tarjeta de papel: los nueve de ida, OUT, los nueve de vuelta, IN y el
   total. La columna de los nombres se queda fija al deslizar -son 22
   columnas y sin eso no se sabe de quién es el renglón que estás leyendo. */
function vistaTarjeta (T) {
  const d = T.d || 0
  const hoyos = (de, a) => Array.from({ length: a - de }, (_, i) => de + i)
  const cab = `<th class="nom-col">Hoyo</th>` +
    hoyos(0, NUEVE).map(h => `<th>${h + 1}</th>`).join('') + '<th>OUT</th>' +
    hoyos(NUEVE, HOYOS).map(h => `<th>${h + 1}</th>`).join('') + '<th>IN</th><th>TOT</th><th>PTS</th>'

  const filaPar = `<tr class="par"><td class="nom-col">Par</td>` +
    hoyos(0, NUEVE).map(h => `<td>${esc(par(T, d, h))}</td>`).join('') +
    `<td class="tot">${esc(parTramo(T, d, 0, NUEVE))}</td>` +
    hoyos(NUEVE, HOYOS).map(h => `<td>${esc(par(T, d, h))}</td>`).join('') +
    `<td class="tot">${esc(parTramo(T, d, NUEVE, HOYOS))}</td><td class="tot">${esc(parTramo(T, d, 0, HOYOS))}</td><td></td></tr>`

  const filas = jugadores(T).map(j => {
    const ch = hcpCampo(T, j.id)
    const celda = (h) => {
      const g = golpe(T, d, j.id, h)
      const v = golpesEnHoyo(ch, si(T, d, h))
      const marca = v > 0 ? '<sup>▲</sup>' : ''
      if (g === null) return `<td>${marca}</td>`
      return `<td><span class="nota ${notaDe(g, par(T, d, h))}">${esc(g)}</span>${marca}</td>`
    }
    const r = resumenRonda(T, d, j.id)
    return `<tr><td class="nom-col">${esc(j.c)}</td>` +
      hoyos(0, NUEVE).map(celda).join('') +
      `<td class="tot">${esc(sumaTramo(T, d, j.id, 0, NUEVE))}</td>` +
      hoyos(NUEVE, HOYOS).map(celda).join('') +
      `<td class="tot">${esc(sumaTramo(T, d, j.id, NUEVE, HOYOS))}</td>` +
      `<td class="tot">${esc(r.bruto)}</td><td class="tot">${esc(r.pts)}</td></tr>`
  }).join('')

  return `<h2>Tarjeta</h2>
    <div class="scroll-x">
      <table class="card">
        <thead><tr>${cab}</tr></thead>
        <tbody>${filaPar}${filas}</tbody>
      </table>
    </div>
    <p class="guia">Círculo, bajo par. Cuadro, encima. El triángulo marca dónde recibes golpe.</p>`
}




/* Más puntos primero. Quien no ha capturado nada va al final: con cero
   hoyos jugados tendría cero puntos y encabezaría la tabla al revés. */
function posiciones (T) {
  return jugadores(T)
    .map(j => ({ id: j.id, n: j.c, ...resumenTotal(T, j.id) }))
    .sort((a, b) => {
      if (!a.jugados !== !b.jugados) return a.jugados ? -1 : 1
      return b.pts - a.pts
    })
}
function vistaTabla (T) {
  const n = dias(T)
  const pos = posiciones(T)
  const cabDias = n > 1 ? `<div class="pos-dias">${Array.from({ length: n }, (_, d) => `<b>D${d + 1}</b>`).join('')}</div>` : ''
  const filas = pos.map((p, i) => {
    const porDia = n > 1
      ? `<div class="pos-dias">${Array.from({ length: n }, (_, d) => { const r = resumenRonda(T, d, p.id); return `<b>${r.jugados ? esc(r.pts) : '·'}</b>` }).join('')}</div>`
      : ''
    return `<div class="pos-fila${i === 0 && p.jugados ? ' lider' : ''}">
      <div class="pos-n">${i + 1}</div>
      <div class="pos-id"><div class="nom">${esc(p.n)}</div>
        <div class="pos-rondas">${p.jugados ? `${esc(p.jugados)} hoyos · bruto ${esc(p.bruto)}` : 'sin capturar'}</div></div>
      ${porDia}
      <div class="pos-tot">${p.jugados ? esc(p.pts) : '–'}</div>
    </div>`
  }).join('')
  return `<h2>Posiciones</h2>
    <div class="pos-cab"><div class="pos-n"></div><div class="pos-id"></div>${cabDias}<div class="pos-tot">Puntos</div></div>
    ${filas || '<p class="guia">Todavía no hay jugadores.</p>'}`
}

function altaJugador (T, S, nombre, idx) {
  const jid = agregarJugador(T, nombre, idx)
  recordarGente(S, nombre, idx)
  return jid
}

/* Borrar no existe: se marca la baja, y el hecho viaja para que los
   demás teléfonos también lo oculten. Los golpes se quedan. */
const bajaJugador = (T, jid) => emitir(T, `j.${jid}.baja`, 1)
const reactivar = (T, jid) => emitir(T, `j.${jid}.baja`, 0)
const moverAGrupo = (T, d, jid, g) => emitir(T, `g.${d}.${jid}`, g)
const ponCorto = (T, jid, v) => emitir(T, `j.${jid}.c`, String(v ?? '').trim())

/* Renombrar en vez de dar de baja y volver a dar de alta: los golpes ya
   anotados cuelgan del jid. Un nombre vacío se ignora -borraría el del
   grupo- igual que el del torneo.

   Y el mismo nombre otra vez NO se emite. No es ahorro de red: el orden de
   los jugadores en la tarjeta es el sello del hecho que puso el nombre
   (ver `ordenarYMapear`), así que reescribir "Paulino" encima de "Paulino"
   lo mandaba al final de la lista —en todos los teléfonos del grupo—. Pasar
   dos veces por la pregunta de los nombres barajaba la tarjeta entera. */
function ponNombreJugador (T, jid, v) {
  const n = String(v ?? '').trim()
  if (n && n !== nomJug(T, jid)) emitir(T, `j.${jid}.n`, n)
}

/* El sliding de un jugador, en el signo de la lista de Paulino: el número
   es lo que esa persona DA. Se guarda en el hecho del índice -`j.<jid>.i`-,
   que es de donde el motor reparte los golpes hoyo por hoyo, y que va al
   revés a propósito: ahí es el hándicap de golf de toda la vida, los
   golpes que uno RECIBE. Por eso `deSliding` le cambia el signo, y por eso
   ese cambio de signo solo ocurre aquí y al leer en `ui/sliding.js`.

   Un número ilegible no se emite: quien teclea pasa por el vacío antes de
   llegar a lo que quiere, y un 0 accidental le quitaría las ventajas a
   alguien sin que se note. */
function ponSlidingJug (T, jid, v) {
  const s = String(v ?? '').trim().replace(/\s/g, '')
  if (!/^[+-]?\d+(\.\d+)?$/.test(s)) return
  emitir(T, `j.${jid}.i`, deSliding(s))
}
function vistaRoster (T, S) {
  const d = T.d || 0
  const jug = jugadores(T)
  /* min-width:0 deja que la columna del nombre se encoja por debajo de su
     ancho de contenido (si no, un nombre largo empuja la fila entera fuera
     de la pantalla). Eso por sí solo no basta: sin nowrap+ellipsis, el
     texto sigue pintándose a su ancho real y se monta sobre los botones.
     Se recorta con puntos suspensivos en vez de partirlo en dos renglones
     porque el roster se lee al sol y de un vistazo: un nombre recortado
     sigue siendo identificable, pero un renglón que cambia de alto según
     el nombre rompe el ritmo de lectura y desplaza los botones de la fila
     siguiente. */
  const filas = jug.map(j => `<div class="fila">
      <div class="quien"><span class="nom">${esc(j.n)}</span>
        <div class="tenue">sliding ${esc(aSliding(j.i) > 0 ? '+' + aSliding(j.i) : aSliding(j.i))} · ${esc(comoSeLee(aSliding(j.i)))} · grupo ${esc(grupo(T, d, j.id) + 1)}</div>
        <input class="corto" value="${esc(cortoEscrito(T, j.id))}"
          placeholder="${esc(cortoAuto(j.n))}" data-cambio="setCorto" data-jid="${esc(j.id)}"
          aria-label="nombre corto"></div>
      <div class="acciones">
        <button data-accion="moverGrupo" data-jid="${esc(j.id)}" data-delta="-1" aria-label="grupo anterior">−</button>
        <button data-accion="moverGrupo" data-jid="${esc(j.id)}" data-delta="1" aria-label="grupo siguiente">+</button>
        <button data-accion="darBaja" data-jid="${esc(j.id)}">Quitar</button>
      </div>
    </div>`).join('')

  const libreta = S.gente
    .filter(g => !jug.some(j => j.n === g.n))
    .map(g => `<div class="fila" data-accion="altaDesdeLibreta"
         data-nombre="${esc(g.n)}" data-indice="${esc(g.i)}">
        <div class="quien"><span class="nom">${esc(g.n)}</span></div>
        <span class="tenue">${esc(g.i)} · agregar</span>
      </div>`).join('')

  /* Quitar no es destruir: el spec promete que los dados de baja se pueden
     reactivar. Sin esta sección, "Quitar" en un toque equivocado a mitad
     de la ronda borraba la tarjeta de alguien para siempre en la práctica:
     "Agregar jugador" de nuevo acuña un jid nuevo, y los golpes ya
     capturados con el jid viejo quedan huérfanos. */
  const bajos = bajas(T)
    .map(j => `<div class="fila">
      <div class="quien"><span class="nom">${esc(j.n)}</span>
        <div class="tenue">índice ${esc(j.i)} · de baja</div></div>
      <div class="acciones">
        <button data-accion="reactivarJugador" data-jid="${esc(j.id)}">Reactivar</button>
      </div>
    </div>`).join('')

  /* Las tarjetas de grupo de Santa Fe: se leen de un vistazo en el tee.
     Debajo sigue la lista con la que se edita. */
  const tarjetas = gruposDe(T, d).map((g, i) => `<div class="grupo">
      <h3>Grupo ${i + 1} <span>${esc(g.length)}</span></h3>
      <ol>${g.map(id => { const j = jug.find(x => x.id === id); return j ? `<li>${esc(j.n)} <span>${esc(j.i)}</span></li>` : '' }).join('')}</ol>
    </div>`).join('')
  return `${tarjetas}
    <h2>Jugadores <span class="tenue">· ${esc(gruposDe(T, d).length)} grupo(s)</span></h2>
    ${filas || '<p class="tenue">Todavía no hay jugadores.</p>'}
    <h2>Agregar</h2>
    <input id="nomNuevo" placeholder="nombre">
    <input id="idxNuevo" placeholder="índice" inputmode="decimal">
    <button class="btn" data-accion="altaNueva">Agregar jugador</button>
    ${libreta ? `<h2 class="tenue">Ya jugaron contigo</h2>${libreta}` : ''}
    ${bajos ? `<h2 class="tenue">Dados de baja</h2>${bajos}` : ''}`
}



/* La puerta de Santa Fe. `T.yo` es local: cada teléfono dice quién es y
   nadie lo verifica — confianza entre amigos. "Solo miro" deja T.yo en
   cadena vacía: contestado, distinto de null (no preguntado). */
function vistaQuien (T) {
  const botones = jugadores(T).map(j =>
    `<button class="btn sec" data-accion="soyYo" data-jid="${esc(j.id)}">${esc(j.n)}</button>`).join('')
  return `<div class="hoja puerta">
    <h1>¿Quién eres?</h1>
    <p class="guia">Para mostrarte tu grupo al capturar, en este teléfono.</p>
    ${botones}
    <button class="btn sec" data-accion="soyYo" data-jid="">Solo miro</button>
  </div>`
}






const conSigno = (v) => (v > 0 ? '+' + v : String(v))
const claseSigno = (v) => (v > 0 ? 'arr' : (v < 0 ? 'aba' : ''))
const sumaGolpes = (T, d, jid, de, a) => {
  let t = 0, n = 0
  for (let h = de; h < a; h++) { const g = golpe(T, d, jid, h); if (g !== null) { t += g; n++ } }
  return n ? String(t) : '·'
}
const sumaPar = (T, d, de, a) => { let t = 0; for (let h = de; h < a; h++) t += par(T, d, h); return t }

/* Fila de golpes de la tabla 1: bajo/alto contra el par, OUT, IN, TOT. */
function filaGolpes (T, d, jid) {
  const celda = (h) => {
    const g = golpe(T, d, jid, h)
    if (g === null) return '<td></td>'
    const p = par(T, d, h)
    return `<td class="${g < p ? 'bajo' : (g > p ? 'alto' : '')}">${esc(g)}</td>`
  }
  let f = `<td class="nom-col">${esc(corto(T, jid))}</td>`
  for (let h = 0; h < 9; h++) f += celda(h)
  f += `<td class="tot">${esc(sumaGolpes(T, d, jid, 0, 9))}</td>`
  for (let h = 9; h < HOYOS; h++) f += celda(h)
  f += `<td class="tot">${esc(sumaGolpes(T, d, jid, 9, 18))}</td><td class="tot">${esc(sumaGolpes(T, d, jid, 0, 18))}</td>`
  return `<tr>${f}</tr>`
}

/* Celda de la tabla 2: el marcador acumulado de esa apuesta en ese hoyo;
   `nace` donde la presión arranca (nunca en el 1 ni en el 10). */
function celdaApuesta (ap, h) {
  if (!ap || ap.hist[h] === null) return '<td class="vacia"></td>'
  const v = ap.hist[h]
  const nace = h === ap.ini && h !== 0 && h !== 9
  return `<td class="${nace ? 'nace' : claseSigno(v)}">${esc(conSigno(v))}</td>`
}

function pactos (T, d, yo, rivales) {
  return rivales.map(rid => {
    const v = slidingDe(T, d, yo, rid)
    const texto = v < 0 ? `te da ${-v}` : (v > 0 ? `le das ${v}` : 'parejos')
    return `<div class="fila">
      <div class="quien"><span class="nom">${esc(corto(T, rid))}</span>
        <div class="meta">${esc(motivoSliding(T, d, yo, rid))}</div></div>
      <div class="acciones">
        <button data-accion="slidingMenos" data-rid="${esc(rid)}" aria-label="un golpe menos">−</button>
        <span class="pacto-val ${v < 0 ? 'arr' : (v > 0 ? 'aba' : '')}">${esc(texto)}</span>
        <button data-accion="slidingMas" data-rid="${esc(rid)}" aria-label="un golpe más">+</button>
      </div></div>`
  }).join('')
}

function acumulado (T, yo) {
  const q = cuentaPresiones(T, yo)
  if (q.porDia.filter(x => x !== null).length < 2) return ''
  const filas = [...q.porRival].map(([rid, v]) =>
    `<tr><td class="nom-col">${esc(corto(T, rid))}</td><td class="${claseSigno(v)}">${esc(conSigno(v))}</td></tr>`).join('')
  return `<h2>Acumulado del torneo</h2>
    <div class="rejilla"><table>${filas}
      <tr><td class="nom-col"><b>Total</b></td><td class="tot ${claseSigno(q.gran)}">${esc(conSigno(q.gran))}</td></tr>
    </table></div>`
}

/* La cabecera de hoyos y la fila del par: las usan la vista de uno contra
   uno y la de equipos, y son idénticas en las dos. */
function cabezaDePresiones () {
  let cab = '<th>Hoyo</th>'
  for (let h = 0; h < 9; h++) cab += `<th>${h + 1}</th>`
  cab += '<th>OUT</th>'
  for (let h = 9; h < HOYOS; h++) cab += `<th>${h + 1}</th>`
  return cab + '<th>IN</th><th>TOT</th>'
}

function filaDelPar (T, d) {
  let fp = '<td class="nom-col">Par</td>'
  for (let h = 0; h < 9; h++) fp += `<td>${esc(par(T, d, h))}</td>`
  fp += `<td class="tot">${esc(sumaPar(T, d, 0, 9))}</td>`
  for (let h = 9; h < HOYOS; h++) fp += `<td>${esc(par(T, d, h))}</td>`
  return fp + `<td class="tot">${esc(sumaPar(T, d, 9, 18))}</td><td class="tot">${esc(sumaPar(T, d, 0, 18))}</td>`
}

/* La tabla de la escalera: un renglón por apuesta, la ida a la izquierda y
   la vuelta a la derecha, con lo que vale cada una al final. */
function tablaDeEscalera (m, ida, vuelta) {
  const idaAps = m.apuestas.filter(x => x.fin === 8)
  const vtaAps = m.apuestas.filter(x => x.fin === 17)
  let filasP = ''
  for (let k = 0; k < Math.max(idaAps.length, vtaAps.length); k++) {
    const a = idaAps[k], b = vtaAps[k]
    const u = (a ? a.unidad * ida : 0) + (b ? b.unidad * vuelta : 0)
    let f = `<td class="nom-col">${k === 0 ? 'Salida' : 'Presión ' + k}</td>`
    for (let h = 0; h < 9; h++) f += celdaApuesta(a, h)
    f += `<td class="tot ${a ? claseSigno(a.st) : ''}">${a ? esc(conSigno(a.st)) : ''}</td>`
    for (let h = 9; h < HOYOS; h++) f += celdaApuesta(b, h)
    f += `<td class="tot ${b ? claseSigno(b.st) : ''}">${b ? esc(conSigno(b.st)) : ''}</td>`
    f += `<td class="tot ${claseSigno(u)}">${u === 0 ? '—' : esc(conSigno(u))}</td>`
    filasP += `<tr>${f}</tr>`
  }
  return filasP
}

/* Las modalidades por equipos: en vez de elegir rival, se ven los partidos
   que se están jugando en la mesa. En Mudo y en Yo-Yo son tres —cada quien
   contra los otros dos por turnos— y tú sales en los tres. */
function vistaPresionesEquipos (T, d, yo, modo) {
  const gi = gruposDe(T, d).findIndex(g => g.includes(yo))
  const A = apuestaPresiones(d, gi)
  const { partidos } = evaluarPresionesEquipos(T, A, modo, HOYOS - 1).vivo
  const nombre = (MODOS_PRESIONES.find(x => x[0] === modo) || [, modo])[1]
  const cab = cabezaDePresiones()
  const fp = filaDelPar(T, d)
  const nombres = (l, conMudo) => l.map(j => esc(corto(T, j))).concat(conMudo ? ['el Mudo'] : []).join(' y ')

  let mio = 0
  const bloques = partidos.map(pt => {
    const dinero = pt.q.capturado ? pt.q.total : 0
    /* Lo que te toca a TI de ese partido: cada quien liquida con cada
       rival del otro bando, así que el solitario cobra o paga dos veces. */
    const tuyo = pt.realesA.includes(yo)
      ? dinero * pt.realesB.length
      : (pt.realesB.includes(yo) ? -dinero * pt.realesA.length : 0)
    mio += tuyo
    const conMudo = modo === 'mudo'
    const doble = modo === 'yoyo' && pt.realesA.includes(yo)
    const enJuego = pt.realesA.concat(pt.realesB)
    return `<h2>${nombres(pt.realesA, conMudo)} contra ${nombres(pt.realesB, false)}</h2>
      ${doble ? '<p class="guia">Tu score cuenta dos veces: una bola en neto y la otra en bruto.</p>' : ''}
      ${conMudo ? '<p class="guia">La bola del Mudo es el renglón del par: hace par en los dieciocho y nunca cobra ni paga.</p>' : ''}
      <div class="rejilla"><table>
        <tr>${cab}</tr>
        <tr class="par">${fp}</tr>
        ${enJuego.map(j => filaGolpes(T, d, j)).join('')}
      </table></div>
      <div class="rejilla bloque"><table>
        <tr>${cab}</tr>
        ${tablaDeEscalera(pt.m, pt.q.precioIda, pt.q.precioVuelta)}
      </table></div>
      <p class="veredicto ${claseSigno(tuyo)}">${tuyo === 0 ? 'Tablas' : (tuyo > 0 ? `Ganas ${esc(tuyo)}` : `Pierdes ${esc(-tuyo)}`)}</p>`
  }).join('')

  const torcidos = partidos.some(pt => pt.cuadran === false)
  return `<h2>Presiones · ${esc(nombre)}</h2>
    <p class="guia">El hoyo se decide con las dos bolas del equipo: la mejor contra la mejor y la peor contra la peor. Cada comparación vale un punto, así que un hoyo va de −2 a +2 y las presiones se abren más rápido.</p>
    ${torcidos ? '<p class="guia">Los bandos no están marcados dos y dos, así que se partió el grupo por la mitad. Se cambian tocando a cada quien en la pestaña del juego.</p>' : ''}
    ${bloques}
    <p class="veredicto ${claseSigno(mio)}">${mio === 0 ? 'Hoy vas parejo' : (mio > 0 ? `Hoy vas +${esc(mio)}` : `Hoy vas ${esc(mio)}`)}</p>
    <p class="guia">La modalidad se cambia en Ajustes. El sliding que se pacta a mano es cosa del uno contra uno; aquí las ventajas salen del hándicap de cada quien.</p>`
}
function vistaPresiones (T) {
  if (!T.yo) {
    return `<h2>Presiones</h2><p class="guia">Di quién eres para ver tus presiones.</p>
      <button class="btn sec" data-accion="cambiarYo">Decir quién soy</button>`
  }
  const d = T.d || 0
  const yo = T.yo
  const g = miGrupo(T, d)
  const rivales = g ? g.filter(id => id !== yo) : []
  if (!rivales.length) return '<h2>Presiones</h2><p class="guia">No hay rivales en tu grupo.</p>'
  const modo = presModo(T)
  const conEquipos = modo !== 'ind' && modoCabe(modo, g.length)
  /* Las dos a la vez: primero el uno contra uno, que es lo que se mira de
     reojo en el tee, y debajo el partido del foursome. */
  const bloqueEquipos = conEquipos ? vistaPresionesEquipos(T, d, yo, modo) : ''
  if (conEquipos && !presInd(T)) return bloqueEquipos
  const rival = rivales.includes(T.rival) ? T.rival : rivales[0]
  const nomR = corto(T, rival)

  const segm = rivales.map(id =>
    `<button class="${id === rival ? 'on' : ''}" data-accion="setRival" data-rid="${esc(id)}">${esc(corto(T, id))}</button>`).join('')

  const cab = cabezaDePresiones()
  const fp = filaDelPar(T, d)

  const m = presionesMatch(T, d, yo, rival)
  const q = dineroDesglosado(T, d, yo, rival)
  const ida = q.precioIda, vuelta = q.precioVuelta
  const filasP = tablaDeEscalera(m, ida, vuelta)
  const dIda = q.ida, dVta = q.vuelta
  let fd = '<td class="nom-col">Dinero</td>'
  for (let h = 0; h < 9; h++) fd += '<td></td>'
  fd += `<td class="tot ${claseSigno(dIda)}">${esc(conSigno(dIda))}</td>`
  for (let h = 9; h < HOYOS; h++) fd += '<td></td>'
  fd += `<td class="tot ${claseSigno(dVta)}">${esc(conSigno(dVta))}</td><td class="tot ${claseSigno(dIda + dVta)}">${esc(conSigno(dIda + dVta))}</td>`

  const dinero = q.total
  const terceroTxt = q.carry
    ? `hay carry: la ida cerró en cero y cada apuesta de la vuelta vale ${esc(vuelta)}`
    : (presMatch(T) === 'suma' ? 'el match es el signo de la suma de las dos salidas' : 'el bono es para quien junte más')
  const veredicto = dinero === 0 ? `Tablas con ${esc(nomR)}`
    : (dinero > 0 ? `Te debe ${esc(dinero)} ${esc(nomR)}` : `Le debes ${esc(-dinero)} a ${esc(nomR)}`)

  return `<h2>Hoy juegas con</h2>
    ${pactos(T, d, yo, rivales)}
    <h2>El match</h2>
    <div class="segm">${segm}</div>
    <div class="rejilla"><table>
      <tr>${cab}</tr>
      <tr class="par">${fp}</tr>
      ${filaGolpes(T, d, yo)}
      ${filaGolpes(T, d, rival)}
    </table></div>
    <div class="rejilla bloque"><table>
      <tr>${cab}</tr>
      ${filasP}
      <tr>${fd}</tr>
    </table></div>
    <p class="veredicto ${claseSigno(dinero)}">${veredicto}</p>
    <p class="guia">Ida ${esc(ida)} · vuelta ${esc(vuelta)} por apuesta; ${terceroTxt}. Presión automática al ir abajo.</p>
    ${bloqueEquipos}
    ${dias(T) > 1 ? acumulado(T, yo) : ''}`
}







/* La pestaña del juego del torneo. No hay lista de apuestas ni alta: hay
   UN juego, el que se eligió en Ajustes, y el libro lo sintetiza para mi
   grupo. Esta pantalla es su detalle más las cuentas del día. */

/* El menos es el signo tipográfico, no el guion del teclado: en la fuente
   mono del marcador tiene el mismo ancho que el más y las columnas de
   dinero no bailan. */
const signoTexto = (v) => (v > 0 ? '+' + v : (v < 0 ? '−' + Math.abs(v) : '—'))
const signoClase = (v) => (v > 0 ? 'arr' : (v < 0 ? 'aba' : ''))

const miDinero = (lineas, jid) =>
  lineas.reduce((t, l) => t + (l.a === jid ? l.monto : (l.de === jid ? -l.monto : 0)), 0)

const sumaDe = (T, d, jid, de, a) => {
  let t = 0
  let n = 0
  for (let h = de; h < a; h++) { const g = golpe(T, d, jid, h); if (g !== null) { t += g; n++ } }
  return n ? String(t) : '·'
}

/* Cabecera de 18 hoyos con sus cortes: la misma forma que la tarjeta. */
function cabezaHoyos () {
  let c = '<th>Hoyo</th>'
  for (let h = 0; h < 9; h++) c += `<th>${h + 1}</th>`
  c += '<th>OUT</th>'
  for (let h = 9; h < HOYOS; h++) c += `<th>${h + 1}</th>`
  return c + '<th>IN</th><th>TOT</th>'
}

function filaDeGolpes (T, A, jid) {
  const d = A.d
  const celda = (h) => {
    const g = golpe(T, d, jid, h)
    if (g === null) return '<td></td>'
    const p = par(T, d, h)
    return `<td class="${g < p ? 'bajo' : (g > p ? 'alto' : '')}">${esc(g)}</td>`
  }
  let f = `<td class="nom-col">${esc(corto(T, jid))}</td>`
  for (let h = 0; h < 9; h++) f += celda(h)
  f += `<td class="tot">${esc(sumaDe(T, d, jid, 0, 9))}</td>`
  for (let h = 9; h < HOYOS; h++) f += celda(h)
  f += `<td class="tot">${esc(sumaDe(T, d, jid, 9, 18))}</td><td class="tot">${esc(sumaDe(T, d, jid, 0, 18))}</td>`
  return `<tr>${f}</tr>`
}

const celdaHist = (fila, h) => {
  const v = fila.hist[h]
  if (v === null || v === undefined) return '<td class="vacia"></td>'
  return `<td class="${signoClase(v)}">${esc(signoTexto(v))}</td>`
}

/* Las filas de tramos: una por apuesta -salida, presión, tramo- con su
   historia, su marcador y lo que vale. */
function tablaDeTramos (T, A, vivo) {
  /* Los tramos vienen contados desde el lado A. Si yo juego en el B, todo
     -marcador, historia y dinero- se invierte para que la tabla diga lo
     mismo que el veredicto de arriba; si no, un jugador del lado B leía
     «Vas −1500» sobre tres renglones que decían +500. */
  const mio = vivo.lados[1].includes(T.yo) ? -1 : 1
  const filas = vivo.filas.map(f0 => {
    const f = mio > 0 ? f0 : {
      ...f0,
      st: -f0.st,
      dinero: -f0.dinero,
      hist: f0.hist.map(x => (x === null ? null : -x)),
      texto: f0.texto.replace('arriba', '\u0000').replace('abajo', 'arriba').replace('\u0000', 'abajo')
    }
    let c = `<td class="nom-col">${esc(f.et)}</td>`
    for (let h = 0; h < 9; h++) c += celdaHist(f, h)
    /* La columna OUT solo dice algo en los tramos que terminan en el 9;
       los de la vuelta y el global cierran en la columna IN. */
    c += f.fin <= 8 ? `<td class="tot ${signoClase(f.st)}">${esc(signoTexto(f.st))}</td>` : '<td class="tot"></td>'
    for (let h = 9; h < HOYOS; h++) c += celdaHist(f, h)
    c += `<td class="tot ${signoClase(f.st)}">${esc(f.texto)}</td>`
    c += `<td class="tot ${signoClase(f.dinero)}">${esc(signoTexto(f.dinero))}</td>`
    return `<tr>${c}</tr>`
  }).join('')
  const enJuego = vivo.lados[0].concat(vivo.lados[1])
  const nombres = (l) => l.map(j => esc(corto(T, j))).join(' y ')
  const cabecera = mio > 0
    ? `${nombres(vivo.lados[0])} contra ${nombres(vivo.lados[1])}`
    : `${nombres(vivo.lados[1])} contra ${nombres(vivo.lados[0])}`
  return `<p class="guia">${cabecera}</p>
    <div class="rejilla"><table>
      <tr>${cabezaHoyos()}</tr>
      ${enJuego.map(j => filaDeGolpes(T, A, j)).join('')}
    </table></div>
    <div class="rejilla bloque"><table>
      <tr>${cabezaHoyos()}</tr>
      ${filas}
    </table></div>`
}

function tablaDePuntos (T, A, vivo) {
  const cab = '<th>Hoyo</th>' + Array.from({ length: HOYOS }, (_, h) => `<th>${h + 1}</th>`).join('') + '<th>TOT</th>'
  const redondo = (x) => Math.round(x * 10) / 10
  const filas = vivo.jugadores.map((jid, i) => {
    /* Una celda vacía es un hoyo que ese jugador no ha jugado. Sin esto
       salía un 0, que en Skins y en Chicago se lee como "aquí no sacó
       nada" y es una cosa bien distinta. */
    const celdas = vivo.porHoyo.map(p => {
      const v = p === null ? null : p[i]
      return `<td>${v === null || v === undefined ? '' : esc(redondo(v))}</td>`
    }).join('')
    return `<tr><td class="nom-col">${esc(corto(T, jid))}</td>${celdas}<td class="tot">${esc(redondo(vivo.totales[i]))}</td></tr>`
  }).join('')
  return `<div class="rejilla"><table>
      <tr>${cabezaHoyos()}</tr>
      ${vivo.jugadores.map(j => filaDeGolpes(T, A, j)).join('')}
    </table></div>
    <h2>${esc(vivo.titulo || 'Puntos')}</h2><div class="rejilla"><table><tr>${cab}</tr>${filas}</table></div>
    ${(vivo.pie || []).some(Boolean)
      ? `<p class="guia">${vivo.pie.map((t, i) => (t ? `${esc(corto(T, vivo.jugadores[i]))} ${esc(t)}` : null)).filter(Boolean).join(' · ')}</p>`
      : ''}`
}

function tablaDeOnces (T, A, vivo) {
  const cab = '<th>Hoyo</th>' + Array.from({ length: HOYOS }, (_, h) => `<th>${h + 1}</th>`).join('') + '<th>NETO</th>'
  const filas = vivo.jugadores.map(x => {
    const cuenta = new Set(x.cuentan)
    const forzado = new Set(x.forzados)
    const celdas = Array.from({ length: HOYOS }, (_, h) =>
      `<td class="${cuenta.has(h) ? (forzado.has(h) ? 'nace' : 'cuenta') : 'fuera'}">${h + 1}</td>`).join('')
    return `<tr><td class="nom-col">${esc(corto(T, x.jid))}</td>${celdas}
      <td class="tot">${x.compite ? esc(x.total) : `${esc(x.cuentan.length)} de 11`}</td></tr>`
  }).join('')
  return `<div class="rejilla"><table>
      <tr>${cabezaHoyos()}</tr>
      ${vivo.jugadores.map(x => filaDeGolpes(T, A, x.jid)).join('')}
    </table></div>
    <div class="rejilla bloque"><table><tr>${cab}</tr>${filas}</table></div>
    <p class="guia">Se marcan en Hoy, con el chip de cada jugador. Un hoyo se cierra cuando entra el golpe del siguiente.</p>`
}

/* Los bandos, solo donde hay dos de a dos: con dos jugadores cada quien es
   su lado y no hay nada que cambiar. El lado se guarda en el torneo
   (t.l.<j5>), así que el botón no necesita decir de qué apuesta habla. */
function bandosDe (T, A) {
  const juego = JUEGOS[A.tipo]
  const p = participantes(T, A)
  if (!juego.lados || p.length < 4) return ''
  const chips = p.map(j => {
    const lado = ladoVisible(T, A, j)
    return `<button class="lado-chip${lado === 0 ? ' on' : ''}" data-accion="setLadoJuego" data-aid="${esc(A.id)}" data-jid="${esc(j)}">${esc(corto(T, j))} · ${lado === 0 ? 1 : 2}</button>`
  }).join('')
  return `<h2>Bandos</h2><div class="chips">${chips}</div>
    <p class="guia">Toca a alguien para cambiarlo de bando.${bandosCuadran(T, A) ? '' : ' Ahora mismo no están parejos, así que se repartió a la mitad: los bandos se guardan para el torneo y hoy el grupo es otro.'}</p>`
}


/* El detalle del juego: el veredicto, los golpes y la forma que cada
   juego tiene de contarse. Sin «Quitar» ni «Volver» -no hay lista- y sin
   ajustes: viven en Ajustes, porque el juego es del torneo entero. */
function vistaDetalleJuego (T, A) {
  const juego = JUEGOS[A.tipo]
  const r = juego.evaluar(T, A)
  const v = r.vivo || {}
  let cuerpoJuego = ''
  if (v.forma === 'segmentos') {
    /* Sin dos bandos no hay partido: antes salían dos tablas con su
       encabezado y ni un renglón debajo, sin explicar nada. */
    cuerpoJuego = v.lados[0].length && v.lados[1].length
      ? tablaDeTramos(T, A, v)
      : '<p class="guia">Hacen falta dos bandos para jugar. Acomódalos abajo.</p>'
  }
  else if (v.forma === 'puntos') cuerpoJuego = tablaDePuntos(T, A, v)
  else if (v.forma === 'onces') cuerpoJuego = tablaDeOnces(T, A, v)
  const dinero = miDinero(r.lineas, T.yo)
  return `<h2>${esc(juego.nombre)}</h2>
    <p class="veredicto ${signoClase(dinero)}">Vas ${esc(signoTexto(dinero))}</p>
    ${cuerpoJuego}
    ${bandosDe(T, A)}`
}

/* Lo que llevo con cada quien HOY, sumando todo lo que se juega: este
   juego y las presiones si están las dos. */
function bloqueCuentas (T) {
  const d = T.d || 0
  const libro = libroDia(T, d)

const exigenciaDe = (juego) =>

  if (!grupo) return `${titulo}<p class="guia">Hoy no estás en ningún grupo. Acomódalos en la pestaña Grupos.</p>`

    juego: () => vistaJuego(T),

  const yo = T.yo ? (jugadores(T).find(j => j.id === T.yo) || {}).n : ''

     estorba a lo que se está anotando. */
  const avisoVersion = versionNueva
    ? '<button class="version-nueva" data-accion="actualizar">Hay una versión nueva de la app · tocar para pasar a ella</button>'

/* ============================================================
   La lectura por IA de una tarjeta en blanco. `fetch` directo,
   sin SDK: el proyecto no tiene dependencias y se arma en un solo
   HTML. Misma decisión que la app de Santa Fe.

   hecho, no se publica y NUNCA sale en un mensaje de error.

const MODELO_IA = 'claude-opus-5'

   `type` no está documentada como soportada y anyOf sí. El esquema no
   puede exigir 18 posiciones (minItems solo admite 0 y 1); de eso se
   encarga revisaLectura. */

const ESQUEMA_TARJETA = {
  type: 'object',
  properties: {
    campo: { type: 'string' },
    par: { type: 'array', items: hueco },
    si: { type: 'array', items: hueco }
  },
  required: ['campo', 'par', 'si'],
  additionalProperties: false
}
const INSTRUCCION_TARJETA = [
  'Esta es la tarjeta EN BLANCO de un campo de golf.',
  'Devuelve el nombre del campo, el par de los 18 hoyos y el índice de dificultad (handicap o stroke index) de los 18 hoyos.',
  'Los arreglos "par" y "si" traen siempre 18 posiciones, del hoyo 1 al 18 en ese orden.',
  'Ante la menor duda pon null en esa posición. NUNCA inventes un número.',
  'Ignora las yardas, el slope, el rating, el hándicap de campo y cualquier casilla para anotar golpes.'
].join(' ')

/* Encoge la foto antes de mandarla: las del iPhone son enormes y mandarlas
   enteras es caro y lento. Copiado de `comprimir` de Santa Fe. */
function comprimeImagen (file, maxLado = 1600) {
  return new Promise((res, rej) => {
    const img = new Image()
    const url = URL.createObjectURL(file)
    img.onload = () => {
      const k = Math.min(1, maxLado / Math.max(img.width, img.height))
      const cv = document.createElement('canvas')
      cv.width = Math.round(img.width * k)
      cv.height = Math.round(img.height * k)
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height)
      URL.revokeObjectURL(url)
      res(cv.toDataURL('image/jpeg', 0.85))
    }
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo abrir la imagen')) }
    img.src = url
  })
}

/* Los errores se traducen a algo que se pueda leer en el estacionamiento.
   El cuerpo crudo no se enseña nunca: puede traer la clave. */
function errorDeEstado (status, texto) {
  if (status === 401 || status === 403) return 'La clave no sirve. Revísala en Ajustes.'
  if (status === 400 && texto.includes(MODELO_IA)) return 'El modelo ya no existe. Hay que actualizar la app.'
  if (status === 429) return 'Demasiadas peticiones seguidas. Espera un momento y vuelve a intentar.'
  return `La API respondió ${status}.`

async function leeTarjeta (dataUrl, clave, buscar = (typeof fetch !== 'undefined' ? fetch.bind(globalThis) : null)) {
  const cuerpo = {
    model: MODELO_IA,
    max_tokens: 16000,
    messages: [{
      role: 'user',
      content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: String(dataUrl).replace(/^data:[^,]*,/, '') } },
        { type: 'text', text: INSTRUCCION_TARJETA }
      ]
    }],
    output_config: { effort: 'medium', format: { type: 'json_schema', schema: ESQUEMA_TARJETA } }
  }
  let r
  try {
    r = await buscar(URL_IA, {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': clave,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(cuerpo)
    })
  } catch (e) {
    throw new Error('Sin señal: no se pudo llegar a la API.')
  }
  if (!r.ok) {
    let texto = ''
    try { texto = await r.text() } catch (e) {}
    throw new Error(errorDeEstado(r.status, texto))
  }
  /* El cuerpo de un 200 también puede venir roto: la conexión del campo se
     cae a media respuesta y `r.json()` lanza un SyntaxError en inglés que
     se saltaba la traducción entera. */
  let datos
  try {
    datos = await r.json()
  } catch (e) {
    throw new Error('La respuesta no se entendió: pudo venir incompleta. Vuelve a intentar.')
  }
  const bloque = (datos && typeof datos === 'object' ? datos.content || [] : []).find(b => b && b.type === 'text')
  if (!bloque || !bloque.text) throw new Error('La respuesta vino vacía.')
  try {
    return JSON.parse(bloque.text)
  } catch (e) {
    throw new Error('La respuesta no se entendió: pudo venir incompleta. Vuelve a intentar.')
  }
}




/* Alta, baja y ajustes de una apuesta. Nada aquí calcula: solo emite
   hechos. Un número escrito en un formulario llega como texto; se guarda
   como número para que el motor no tenga que adivinar después. */
const valorCfg = (v) => {
  if (typeof v === 'number' || typeof v === 'boolean') return v
  const s = String(v ?? '').trim()
  if (s !== '' && /^-?\d+$/.test(s)) return parseInt(s, 10)
  return s
}

/* Cuatro caracteres, no diez: con `a.<aid>.c.empate` ya vamos en 15 de los
   16 que el servidor v1 respeta. 32^4 es un millón; un torneo tiene un
   puñado de apuestas. */
function nuevaApuesta (T, { tipo, d, grupo, cfg = {} }, ahora = Date.now()) {
  const aid = sortear(4)
  emitir(T, `a.${aid}.t`, String(tipo), ahora)
  emitir(T, `a.${aid}.d`, Number(d) || 0, ahora)
  emitir(T, `a.${aid}.g`, Number(grupo) || 0, ahora)
  for (const k in cfg) emitir(T, llaveCfg(aid, k), valorCfg(cfg[k]), ahora)
  return aid

/* Quitar no borra: pone la baja. Los hechos no se pueden retirar del
   servidor, y un borrado local reaparecería en la próxima bajada. */
const quitarApuesta = (T, aid) => emitir(T, `a.${aid}.x`, 1)

/* Los 18 hoyos de un jugador viajan en UN hecho: una máscara de bits. Es
   el precio del límite de 16 caracteres de la llave, y se paga en
   granularidad de fusión -dos teléfonos marcando para el mismo jugador a
   la vez se pisan-, que es aceptable: cada quien marca los suyos. */
/* Marcar o desmarcar una unidad de las que no salen del score: el sandy
   -salir de la trampa y salvar el par- y el oyes -la bola más cercana en
   un par 3-. */
function marcarUnidad (T, d, cual, jid, h, v) {
  const antes = mascaraUni(T, d, cual, jid)
  const despues = v ? (antes | (1 << h)) : (antes & ~(1 << h))

  const antes = mascaraOnces(T, aid, jid)
  const despues = v ? (antes | (1 << h)) : (antes & ~(1 << h))
  emitir(T, llaveOnces(aid, jid), despues)
}

    if (pasoActual() === 2 && t && S.asis && S.asis.tid === t.tid && !hayGolpes(t)) {
      quitarTorneo(S, t.tid)
      S.asis = { paso: 1 }
      salvar()
      return
    }
    S.asis = { ...(S.asis || {}), paso: Math.max(1, pasoActual() - 1) }
    salvar()
  },
  asisSigue: () => {
    /* Una partida se queda con el nombre del campo: en la lista de
       torneos "Club de Golf Chapultepec" dice más que "Partida de hoy". */
    const t = T()
    if (t && S.asis && S.asis.tipo === 'partida' && pasoActual() === 2 && campo(t, t.d || 0)) {
      ponNombre(t, campo(t, t.d || 0))
    }
    S.asis = { ...(S.asis || {}), paso: Math.min(PASOS, pasoActual() + 1) }
    salvar(); programar()
  },
  asisFoto: () => { S.asis = { ...(S.asis || {}), foto: true }; salvar() },
  asisPartida: async () => { await arrancaTorneo('Partida de hoy', 1, 'partida') },
  asisTorneo: async () => {
    const campoNom = document.getElementById('asisNombre')
    const nom = campoNom ? campoNom.value.trim() : ''
    if (!nom) { avisar('Ponle un nombre al torneo'); if (campoNom && campoNom.focus) campoNom.focus(); return }
    const dd = Math.max(1, parseInt(document.getElementById('asisDias').value, 10) || 1)
    await arrancaTorneo(nom, dd, 'torneo')
  },
  asisCuantos: d => { S.asis = { ...(S.asis || {}), cuantos: Number(d.n), paso: 4 }; salvar() },
  asisNombres: () => {
    const t = T()
    if (!t) return
    const cuantos = cuantosDe(S)
    /* Sin filtrar los vacíos: la casilla ES el jugador. Compactando la
       lista, borrar la casilla de en medio corría a todos los de abajo y
       el jugador de la 2 se quedaba con el nombre del de la 3 -y con los
       golpes del de la 2, que cuelgan de su jid-. */
    const casillas = Array.from({ length: cuantos }, (_, i) => {
      const el = document.getElementById('asisNom' + i)
      return el ? String(el.value || '').trim() : ''
    })
    if (!casillas.some(Boolean)) { avisar('Pon al menos un nombre'); return }
    avisar('')
    /* El asistente solo manda sobre los jugadores que él mismo dio de
       alta. A quien agregó otro teléfono -o el propio dueño desde Grupos-
       no lo renombra ni lo da de baja: esas bajas viajaban al grupo
       entero y borraban a gente de la lista de todos. */
    const jids = [...((S.asis && S.asis.jids) || [])]
    const vivos = new Set(jugadores(t).map(j => j.id))
    const caidos = new Set(bajas(t).map(j => j.id))
    casillas.forEach((nom, i) => {
      const jid = jids[i]
      if (nom) {
        if (jid && (vivos.has(jid) || caidos.has(jid))) {
          /* Volver a subir de 2 a 5 recupera a los de antes en vez de
             acuñar jids nuevos y dejar fantasmas en "Dados de baja". */
          if (caidos.has(jid)) reactivar(t, jid)
          ponNombreJugador(t, jid, nom)
        } else {
          jids[i] = altaJugador(t, S, nom, indiceDeGente(S, nom))
        }
      } else if (jid && vivos.has(jid)) {
        bajaJugador(t, jid)
      }
    })
    /* Si ahora juegan menos, los de las casillas que ya no se ven salen. */
    jids.slice(cuantos).forEach(jid => { if (jid && vivos.has(jid)) bajaJugador(t, jid) })
    const yo = jids.find(j => j && jugadores(t).some(x => x.id === j))
    if (yo) t.yo = yo
    S.asis = { ...(S.asis || {}), jids, paso: 5 }
    salvar(); programar()
  },

  setVentaja: (d, el) => {

  asisListo: () => { S.asis = null; S.vista = 'hoy'; salvar(); programar() },

  usarCampo: (d, el) => {

  setCfgJuego: (d, el) => { ponCfg(T(), formato(T()) + '-0', d.k, el.value); salvar(); programar() },

    const A = apuestasDelDia(t, t.d || 0).find(x => x.id === d.aid)

  marcaOnce: d => {

  /* ── Golf Sliding ─────────────────────────────────────────────────

  setSliding: (d, el) => {

  pegaSliding: () => {

    if (!leidos.length) { avisar('No encontré ningún nombre con su número'); return }
    for (const g of leidos) recordarGente(S, g.n, deSliding(g.sliding))

  /* El sandy se marca hoyo por hoyo, en Hoy. Solo cuenta con par o mejor,
     pero la marca se respeta aunque el golpe todavía no esté anotado: se

  marcaSandy: d => {

  marcaOyes: d => {

    const puesto = marcaUni(t, dia, 'o', d.jid, h)

  unirmeConLigaPegada: () => {

  unirmeConCodigo: async () => {

  compartirLiga: async () => {
    const liga = ligaDe(T(), base)
    try {

    } catch (e) {

  ponClaveIa: (d, el) => { S.ia.clave = String(el.value || '').trim(); salvar() },
  borrarClaveIa: () => { S.ia.clave = ''; salvar() },

  quitarFoto: () => { S.foto = null; S.lectura = null; S.errorIa = ''; salvar() },
  tomarFoto: async (d, el) => {

/* Los clics van por `data-accion` y los cambios de input por `data-cambio`,
   en espacios de nombres distintos a propósito: si compartieran uno, un
   toque sobre un input dispararía su acción antes de que el usuario
   escribiera nada. */
/* Un fallo que no se ve es un fallo que no se puede arreglar desde el
   campo: sin esto, una acción que tronaba dejaba la pantalla idéntica y
   el teléfono no daba ninguna pista. */
function avisar (mensaje) {
  const nodo = typeof document !== 'undefined' && document.getElementById('aviso')
  if (!nodo) return
  nodo.textContent = mensaje || ''
  nodo.hidden = !mensaje
}

if (typeof window !== 'undefined') {
  window.addEventListener('error', e => avisar('Algo falló: ' + (e.message || e.error)))
  window.addEventListener('unhandledrejection', e => avisar('Algo falló: ' + ((e.reason && e.reason.message) || e.reason)))
}

function delegar (evento, atributo) {
  document.addEventListener(evento, e => {
    const el = e.target.closest(`[data-${atributo}]`)
    if (!el) return
    const f = ACCIONES[el.dataset[atributo]]
    if (!f) return
    try {
      const r = f(el.dataset, el)
      if (r && r.catch) r.catch(x => avisar('Algo falló: ' + (x && x.message ? x.message : x)))
    } catch (x) {
      avisar('Algo falló: ' + (x && x.message ? x.message : x))
    }
  })
}
delegar('click', 'accion')
delegar('change', 'cambio')

let temporizador = null
const programar = () => {
  clearTimeout(temporizador)
  temporizador = setTimeout(sincronizar, 1800)
}

async function sincronizar () {
  const t = T()
  if (!t || !t.clave) return
  /* Un torneo terminado deja de sincronizar: ni red ni batería. Pero NO
     antes de vaciar la cola: en ella está el propio hecho del cierre -y
     con él lo último que se anotó-. Sin esta vuelta final, cerrar el
     torneo al salir del 18 dejaría los golpes del 18 y el cierre varados
     en este teléfono, y el grupo no lo vería terminado nunca. */
  const cerrado = torneoCerrado(t)
  if (cerrado && !t.pend.length) return
  const r = await ciclo(t, red())
  guardar(S, localStorage)
  /* Un hecho fusionado a media sesión puede bajar t.dias por debajo del
     día activo: sin esto T.d se queda apuntando a un día que ya no existe
     hasta el próximo repintado manual. */
  if (r.bajados) acotarDia(t)
  /* Quien se une por liga recibe un torneo VACÍO -sin fechas-: al unirse,
     saltarAHoy no tiene a dónde saltar y T.d se queda en 0 aunque la ronda
     real sea otra. Las fechas llegan con la primera bajada de hechos, así
     que se reintenta aquí, en cada ciclo, hasta que de verdad encuentre el
     día de hoy -una sola vez: t.situado (local, no viaja) evita que el
     ciclo siga saltando después y le pise al usuario un cambio de día
     manual. */
  if (r.bajados && !t.situado && saltarAHoy(t)) t.situado = true
  const chip = document.getElementById('chipSync')
  if (chip) {
    /* 'ocupado' no es un fallo de red -es la guardia de reentrancia de
       ciclo()- así que no se pinta como "sin señal" ni como error: se
       traduce a algo benigno. Los otros dos estados también se traducen
       para que se entiendan sin conocer el nombre interno de la clave. */
    const legible = {
      'en línea': '● en vivo',
      ocupado: '○ sincronizando…',
      'sin señal': '○ sin señal',
      'clave inválida': '○ liga no válida'
    }
    chip.textContent = legible[r.estado] || ('○ ' + r.estado)
    /* Verde solo cuando de verdad está en línea: el chip es lo que se mira
       de reojo en el tee para saber si el grupo está viendo lo que anotas. */
    if (chip.className !== undefined) chip.className = 'chip' + (r.estado === 'en línea' ? ' vivo' : '')
  }
  /* Regla `tecleando` de Santa Fe: si bajó algo mientras el usuario escribe
     en un input, repintar le borraría lo tecleado. El repintado llega con
     su siguiente acción; el chip sí se actualiza arriba. */
  const tecleando = document.activeElement && document.activeElement.tagName === 'INPUT'
  /* Y en el asistente NUNCA se repinta por lo que baje del grupo: la
     pantalla de los nombres tiene cinco casillas escritas que todavía no
     son hechos, y repintar las vacía aunque el dedo no esté en ninguna. */
  if (r.bajados && !tecleando && S.vista !== 'asistente') dibujar()
  /* Un torneo creado sin señal nace sin código: crearDesdeForm ya lo
     intentó una vez y pudo fallar. Este es el "próximo ciclo" real donde
     se reintenta -no hay otro-, en cada vuelta, hasta que el torneo tenga
     uno. Va DESPUÉS de ciclo() y no antes: ciclo() sincroniza los golpes,
     que importan más que el código corto, y antes de este orden un POST
     de registrar() colgado -sin timeout- detenía la sincronización de
     hechos con él, con programar() varado al final de la función: el
     ciclo entero quedaba muerto hasta recargar la app. Tampoco se
     reintenta si el ciclo acaba de devolver 'clave inválida' -ese
     endpoint está limitado por intentos según el spec, y reintentar ahí
     dispararía un 403 cada 1.8s para siempre. Un fallo aquí no debe
     tumbar el ciclo de hechos: se ignora igual que en crearDesdeForm. */
  if (!t.codigo && r.estado !== 'clave inválida') {
    try {
      // el guardar de arriba ya pasó: sin este, el código quedaría solo en memoria.
